/* ---------- Module 1: What is gravity ---------- */
mc('m1a','m1',1,'Which statement describes gravity?',['A force that only pushes objects apart','A non-contact force that pulls objects towards each other','A contact force that acts only on the ground','A force that only exists in space'],1,'Gravity is an attractive {{noncontact|non-contact force}}. Every object with {{mass}} pulls on every other object.');
tf('m1b','m1',1,'Only huge objects such as planets and stars exert a gravitational force.',false,'Every object with mass exerts a gravitational force. For everyday objects the force is far too small to notice – you only feel the pull of something with a very large mass, like the Earth.');
pr('m1c','m1',2,'Two identical rocks are 2 m apart. They are then moved so they are 4 m apart.',{opts:['The gravitational force between them gets bigger','The gravitational force between them gets smaller','The gravitational force stays exactly the same'],a:1},{q:'Which reason is best?',opts:['The force gets weaker as the distance between the objects increases','The rocks have lost some mass','Gravity only acts when objects are touching'],a:0},'The further apart two objects are, the weaker the force of gravity between them.');
mc('m1d','m1',3,'Planet X has twice the mass of planet Y. A spacecraft is the same distance from each planet. What can you say about the pulls on the spacecraft?',['The pull from X is bigger because X has more mass','The pull from Y is bigger because it is smaller','The pulls are the same because the distance is the same','Neither planet pulls on the spacecraft'],0,'The more mass an object has, the stronger its gravitational pull. With the distance equal, planet X pulls harder.',{hint:'Two things control the size of gravitational force: mass and distance. Which one is different here?'});
mt('m1e','m1',1,'Match each term to its meaning.',[['Gravity','An attractive force between objects with mass'],['Mass','The amount of matter in an object'],['Non-contact force','A force that acts without touching']],'These three definitions are the foundation of the whole unit.');
mc('m1f','m1',2,'A student says: "The Moon pulls on Earth with a smaller force than Earth pulls on the Moon, because the Moon is smaller." What is the correct statement?',['The two forces are equal in size and opposite in direction','The Moon pulls on Earth with a bigger force','The Moon does not pull on Earth at all','The forces are the same size and in the same direction'],0,'Gravitational forces always come in pairs. Earth pulls on the Moon and the Moon pulls on Earth with forces of the <b>same size</b> in <b>opposite directions</b>. (Earth barely moves because its mass is so large.)');
mc('m1g','m1',3,'<b>Stretch.</b> Which change would make the gravitational force between two objects the biggest?',['Doubling the distance between them','Halving the distance between them','Doubling the mass of one object','Halving the mass of both objects'],1,'Halving the distance makes the force <b>four times</b> bigger (a distance rule: force ∝ 1 ÷ distance²). Doubling one mass only makes the force twice as big.',{hint:'Closer is stronger. Which change makes the biggest effect – changing distance or changing one mass?'});

/* ---------- Module 2: Forces ---------- */
mc('m2a','m2',1,'In a force diagram, what does the length of an arrow show?',['The size of the force','The mass of the object','The speed of the object','The time the force acts'],0,'Longer arrows show bigger forces; the arrow points in the direction the force acts.');
calc('m2b','m2',2,2,'A car has a driving force of 70 N forwards and air resistance and friction of 45 N backwards. Calculate the size of the resultant force.',25,'N','Resultant = 70 − 45 = 25 N forwards.',{units:['N','kg','N/kg','m/s'],hints:['Forces in opposite directions: subtract the smaller from the larger.','Larger force is 70 N. Subtract the 45 N.','70 − 45 = ?']});
mc('m2c','m2',2,'A box is already sliding to the right. A 40 N push acts to the right and 40 N of friction acts to the left. What will the box do?',['Keep sliding at a constant speed','Speed up','Slow down and stop immediately','Stop at once because it needs a force to keep moving'],0,'The forces are balanced, so the resultant force is zero. With no resultant force an object keeps its speed and direction – motion does not need a force to continue.');
lb('m2d','m2',2,'The diagram shows a skydiver under a parachute. Label the two forces.','chuteLabel',[['1','Air resistance (drag)'],['2','Weight']],['Air resistance (drag)','Weight','Friction','Magnetic force'],'Weight pulls down towards the Earth\'s centre. Air resistance acts upwards, opposite to the motion.');
mc('m2e','m2',3,'In a tug of war, team A pulls left with 35 N and team B pulls right with 20 N. Which statement is correct?',['The resultant force is 15 N to the left','The resultant force is 55 N to the left','The forces are balanced','The resultant force is 15 N to the right'],0,'35 N − 20 N = 15 N in the direction of the bigger force (left). The unbalanced forces make the rope accelerate to the left.');
tf('m2f','m2',1,'Weight is a force that acts towards the centre of the Earth.',true,'Weight is the pull of Earth\'s gravity. It always acts towards the centre of the Earth, which is "downwards" wherever you stand.');
mc('m2g','m2',2,'A cyclist travels along a flat road at a steady 8 m/s. Which statement is true?',['The forces on the cyclist are balanced','There must be a resultant force forwards','There is no air resistance','The weight is bigger than the support force'],0,'Steady speed in a straight line means the resultant force is zero. The driving force equals the resistive forces.');
sh('m2h','m2',3,2,'A student says: "If an object is moving, there must be a resultant force on it." Explain why the student is wrong. Use a car travelling at a constant speed as an example.','A car can move at a constant speed when the forces on it are balanced (driving force = air resistance and friction), so the resultant force is zero. A resultant force is only needed to <b>change</b> the speed or direction, not to keep an object moving.',['The forces are balanced / resultant force is zero (1)','The object keeps moving at constant speed; a resultant force is only needed to change the motion (1)'],{kw:['balanced','resultant force','constant speed'],starters:['When the forces are balanced…','A resultant force is only needed to…']});

/* ---------- Module 3: Mass and weight ---------- */
mt('m3a','m3',1,'Match each description to the correct word or instrument.',[['The unit for mass','kilogram (kg)'],['The unit for weight','newton (N)'],['The instrument that measures mass','balance'],['The instrument that measures weight','newton meter']],'Mass → kg → balance. Weight (a force) → N → newton meter.',{opts:['kilogram (kg)','newton (N)','balance','newton meter','metre rule']});
tf('m3b','m3',2,'An astronaut with a mass of 80 kg on Earth has a mass of 80 kg on the Moon.',true,'Mass is the amount of matter and does not depend on location. Only the weight changes.');
mc('m3c','m3',2,'A 6 kg bag is taken from Earth to the Moon. Which statement is correct?',['Its mass stays 6 kg and its weight decreases','Its mass decreases and its weight stays the same','Both its mass and its weight decrease','Both its mass and its weight stay the same'],0,'The amount of matter in the bag is unchanged, so mass stays the same. The Moon\'s gravitational field strength is smaller, so the weight is smaller.');
pr('m3d','m3',3,'A rock is taken from Earth to Mars.',{opts:['Its weight on Mars is smaller than on Earth','Its weight on Mars is bigger than on Earth','Its weight on Mars is the same as on Earth'],a:0},{q:'Which explanation is best?',opts:['Mars has a smaller gravitational field strength than Earth','The rock has lost some mass on the journey','Mars has no gravity'],a:0},'Mars has less mass than Earth so its gravitational field strength (3.7 N/kg) is smaller than Earth\'s (10 N/kg). The rock\'s mass is unchanged.');
sh('m3e','m3',3,3,'Explain why an object has a smaller weight on the Moon than on Earth.','The object has the same mass in both places. Weight = mass × gravitational field strength. The Moon has less mass than Earth, so its gravitational field strength (1.6 N/kg) is smaller than Earth\'s (10 N/kg), so the object\'s weight is smaller.',['The mass of the object is the same / does not change (1)','Weight depends on gravitational field strength (W = m × g) (1)','The Moon\'s field strength is smaller (1.6 N/kg compared with 10 N/kg) because it has less mass (1)'],{kw:['mass','weight','gravitational field strength','newtons'],starters:['The mass of the object…','Weight depends on…','The Moon has less…']});
mc('m3f','m3',1,'Which instrument is used to measure weight?',['A newton meter','A balance','A measuring cylinder','A stopwatch'],0,'A newton meter (spring balance) measures forces in newtons, and weight is a force.');
mc('m3g','m3',2,'Which of these is <b>not</b> a correct unit for weight?',['kg','N','kN (kilonewton)','newtons'],0,'The kilogram is the unit of <b>mass</b>. Weight is a force, measured in newtons (N).');
mc('m3h','m3',3,'A pupil measures the weight of different masses on Earth: 1 kg → 10 N, 2 kg → 20 N, 3 kg → 30 N. What does the pattern show?',['Weight is directly proportional to mass: each kilogram weighs 10 N','Weight stays the same whatever the mass','Mass is directly proportional to weight, so they are the same thing','Heavier masses have smaller weights'],0,'Doubling the mass doubles the weight. The ratio weight ÷ mass = 10 N/kg is Earth\'s gravitational field strength.');

/* ---------- Module 4: Calculating weight ---------- */
calc('m4a','m4',2,2,'A bag of sugar has a mass of 2 kg. Calculate its weight on Earth. (g = 10 N/kg)',20,'N','W = m × g = 2 × 10 = 20 N');
calc('m4b','m4',2,2,'A rover has a mass of 180 kg. The gravitational field strength on Mars is 3.7 N/kg. Calculate its weight on Mars.',666,'N','W = m × g = 180 × 3.7 = 666 N');
calc('m4c','m4',2,3,'A pupil has a mass of 45 kg. Calculate the pupil\'s weight on the Moon. (g = 1.6 N/kg)',72,'N','Equation: W = m × g<br>Substitute: W = 45 × 1.6<br>Calculate: W = 72 N',{working:true});
calc('m4d','m4',2,2,'A packet of crisps has a mass of 125 g. Calculate its weight on Earth. (g = 10 N/kg)',1.25,'N','Convert: 125 g ÷ 1000 = 0.125 kg<br>W = m × g = 0.125 × 10 = 1.25 N',{hints:['Which unit must mass be in for W = m × g? Convert the grams first.','125 g ÷ 1000 = 0.125 kg.','Now use W = 0.125 × 10.']});
mc('m4e','m4',3,'A pupil calculates the weight of a 4 kg rock on the Moon (g = 1.6 N/kg) as 40 N. What mistake did the pupil make?',['They used Earth\'s value of g (10 N/kg) instead of the Moon\'s','They divided instead of multiplying','They forgot to convert grams to kilograms','Nothing – 40 N is correct'],0,'4 × 10 = 40 N is the weight on <b>Earth</b>. On the Moon it is 4 × 1.6 = 6.4 N. Always check that g matches the place in the question.');
calc('m4f','m4',2,2,'A traveller\'s suitcase has a mass of 12 kg. Calculate its weight on Venus. (g = 8.9 N/kg)',106.8,'N','W = m × g = 12 × 8.9 = 106.8 N');
calc('m4g','m4',2,2,'<b>Stretch.</b> An object weighs 74 N on Mars where g = 3.7 N/kg. Calculate its mass.',20,'kg','Rearrange: m = W ÷ g = 74 ÷ 3.7 = 20 kg',{hints:['Weight = mass × g. To find mass you need to rearrange the equation.','m = W ÷ g','74 ÷ 3.7 = ?']});
mc('m4h','m4',3,'Which answer gives the correct size <b>and</b> unit for the weight of a 3 kg object on Earth (g = 10 N/kg)?',['30 N','30 kg','0.3 N','30 N/kg'],0,'W = 3 × 10 = 30 N. Weight is a force, so the unit is newtons.');

/* ---------- Module 5: Gravitational fields ---------- */
mc('m5a','m5',1,'What does gravitational field strength (g) tell you?',['The gravitational force acting on each 1 kg of mass','The mass of a planet in kg','How fast an object falls','The distance to the centre of a planet'],0,'g is the force per kilogram, in N/kg. On Earth each 1 kg feels about 10 N.');
tf('m5b','m5',1,'Gravitational field strength is measured in N/kg.',true,'Newtons per kilogram: the number of newtons of force on each kilogram.');
pr('m5c','m5',2,'An astronaut travels from the surface of the Earth to a height of 1000 km above it.',{opts:['Her weight gets smaller','Her weight gets bigger','Her weight stays exactly the same'],a:0},{q:'Which explanation is best?',opts:['Gravitational field strength gets weaker as distance from the Earth increases','Her mass decreases as she goes higher','The Earth stops pulling above the atmosphere'],a:0},'Her mass is unchanged but g is weaker further from the Earth, so her weight is smaller.');
mc('m5d','m5',3,'Look at the graph. What does it show about gravitational field strength as distance from the centre of the Earth increases?',['It decreases quickly at first, then more slowly, and never reaches zero','It decreases at a steady rate and reaches zero at 6 Earth radii','It increases quickly at first','It stays constant'],0,'The curve drops steeply then flattens. It gets closer and closer to zero but never actually reaches it – gravity has an infinite range.',{fig:gGraph()});
mc('m5e','m5',2,'Planet P and planet Q are the same size, but planet P has more mass. Which statement is correct?',['g at the surface of P is greater than g at the surface of Q','g at the surface of P is smaller than at Q','g is the same on both','g depends only on the colour of the planet'],0,'The more massive an object, the stronger its gravitational field.');
tf('m5f','m5',1,'Gravity stops acting on an object when it is very far from any planet.',false,'Gravity becomes weaker with distance but never completely disappears. The Sun\'s gravity still holds Neptune, over four billion km away.');
calc('m5g','m5',2,2,'Use the graph. Read off the gravitational field strength at 2 Earth radii from the centre of the Earth.',2.5,'N/kg','At 2 on the x-axis the curve is at 2.5 N/kg.',{fig:gGraph(),tol:.12,hints:['Find 2 on the horizontal axis and go up to the curve.','Read across to the vertical axis.']});
sh('m5h','m5',3,2,'Mars has less mass than Earth. A student says, "A rock on Mars will weigh the same as on Earth." Explain why the student is wrong.','The weight of the rock depends on the gravitational field strength. Mars has less mass than Earth so its field strength (3.7 N/kg) is smaller than Earth\'s (10 N/kg). The rock\'s mass is the same, but its weight on Mars is smaller.',['Weight depends on gravitational field strength (as well as mass) (1)','Mars has a smaller field strength because it has less mass, so the rock weighs less (1)'],{kw:['gravitational field strength','mass','weight']});

/* ---------- Module 6: Solar System ---------- */
od('m6a','m6',1,2,'Put the planets in order, starting with the closest to the Sun.',['Mercury','Venus','Earth','Mars','Jupiter','Saturn','Uranus','Neptune'],'My Very Educated Mother Just Served Us Nachos: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.');
mt('m6b','m6',1,'Match each type of object to an example.',[['Terrestrial planet','Mars'],['Gas giant','Jupiter'],['Ice giant','Neptune'],['Dwarf planet','Pluto']],'Four rocky planets, two gas giants, two ice giants – and dwarf planets such as Pluto, Ceres and Eris.',{opts:['Mars','Jupiter','Neptune','Pluto','The Sun']});
mc('m6c','m6',2,'The gravitational field strengths are: Mercury 3.7, Earth 10, Jupiter 25 and Pluto 0.6 N/kg. On which would a 40 kg pupil weigh the most?',['Jupiter','Earth','Mercury','Pluto'],0,'Biggest g, biggest weight: 40 × 25 = 1000 N on Jupiter.');
calc('m6d','m6',2,2,'An astronaut has a mass of 50 kg. Calculate her weight on Saturn where g = 10.4 N/kg.',520,'N','W = m × g = 50 × 10.4 = 520 N');
mc('m6e','m6',3,'Neptune takes about 165 Earth years to orbit the Sun. Which explanation is best?',['It has a much longer orbit to travel and moves more slowly because the Sun\'s gravity is weaker there','It is the heaviest planet so it moves slowly','There is no gravity on Neptune','The Sun pulls Neptune more strongly than Earth, making it slow'],0,'The further a planet is from the Sun, the longer its path and the weaker the Sun\'s pull, so it moves more slowly. Both effects make the orbit time much longer.');
mc('m6f','m6',1,'Which force keeps the planets in orbit around the Sun?',['Gravity','Friction','Magnetism','Air resistance'],0,'The Sun is by far the most massive object in the Solar System, so its gravity dominates.');
mc('m6g','m6',2,'Astronauts on the International Space Station float because:',['they and the station are in free fall around the Earth, and gravity is still acting','there is no gravity at that height','their mass becomes zero in space','the station has artificial gravity switched off'],0,'At the height of the ISS gravity is still about 89% as strong as at the surface. Astronauts float because they are continuously falling around the Earth.');
mc('m6h','m6',3,'The orbit times of four planets are: Mercury 88 days, Venus 225 days, Earth 365 days, Mars 687 days. What pattern do the data show?',['The further a planet is from the Sun, the longer it takes to orbit','The further from the Sun, the shorter the orbit time','Orbit time does not depend on the distance from the Sun','Heavier planets always orbit faster'],0,'Orbit time increases with distance from the Sun. This is also true for the outer planets – Neptune takes 165 years.');

/* ---------- Module 7: Falling objects ---------- */
mc('m7a','m7',1,'Which two forces act on a skydiver falling through the air?',['Weight and air resistance','Friction and magnetism','Weight and friction from the ground','Air resistance only'],0,'Weight acts down (gravity). Air resistance (drag) acts up, opposite to the motion.');
mc('m7b','m7',2,'A skydiver is falling at terminal velocity. Which statement is true?',['Air resistance equals weight and the resultant force is zero','Weight is bigger than air resistance','Air resistance is bigger than weight','There is no air resistance'],0,'At terminal velocity the forces are balanced. The skydiver keeps falling – but at a constant speed.');
calc('m7c','m7',2,2,'A skydiver and her equipment have a weight of 800 N. She falls at terminal velocity. What is the size of the air resistance?',800,'N','At terminal velocity air resistance = weight = 800 N.',{units:['N','kg','N/kg','m/s'],hints:['What can you say about the forces at terminal velocity?','Balanced forces means the two forces are equal.']});
pr('m7d','m7',3,'A skydiver falling at terminal velocity opens the parachute.',{opts:['The skydiver slows down','The skydiver speeds up','The skydiver continues at the same speed'],a:0},{q:'Which reason is best?',opts:['Air resistance becomes bigger than weight, so the resultant force acts upwards','Weight becomes smaller when the parachute opens','The parachute removes gravity'],a:0},'The parachute has a large surface area, so air resistance suddenly becomes bigger than weight. The resultant force is upwards so the skydiver decelerates.');
mc('m7e','m7',3,'Look at the speed–time graph of a skydiver. Which part shows terminal velocity?',['The flat section before the parachute opens','The steep rise at the start','The sharp fall after the parachute opens','The point where time is zero'],0,'The flat section: speed is constant, so the forces are balanced.',{fig:()=>Chart.svg(Sky.cfg(true))});
tf('m7f','m7',1,'Air resistance acts in the same direction as the motion of a falling object.',false,'Air resistance always opposes motion, so for a falling object it acts upwards.');
mc('m7g','m7',2,'A hammer and a feather are dropped together on the Moon, where there is no air. What happens?',['They hit the ground at the same time','The hammer hits first','The feather hits first','They float'],0,'With no air resistance, objects fall with the same acceleration whatever their mass. Astronaut David Scott showed this on the Moon in 1971.');
sh('m7h','m7',3,3,'Explain, in terms of forces, why a skydiver slows down when the parachute opens.','Opening the parachute greatly increases the surface area, so air resistance becomes bigger than the skydiver\'s weight. The resultant force is upwards so the skydiver slows down. As speed falls the air resistance falls until it equals weight again, and the skydiver falls at a new, lower terminal velocity.',['The parachute increases surface area / air resistance increases (1)','Air resistance is bigger than weight, so the resultant force is upwards and the skydiver decelerates (1)','Air resistance decreases as speed falls until the forces balance again at a lower constant speed (1)'],{kw:['air resistance','weight','resultant force','terminal velocity'],starters:['The parachute increases…','The air resistance becomes…','Eventually the forces…']});

/* ---------- Module 8: Working scientifically ---------- */
mt('m8a','m8',1,'Match each type of variable to its meaning.',[['Independent variable','The thing you change'],['Dependent variable','The thing you measure'],['Control variable','The thing you keep the same']],'In a fair test you change one thing, measure its effect and keep everything else the same.');
mc('m8b','m8',2,'In the crater investigation a pupil changes the drop height and measures the crater depth. Which is a control variable?',['The mass of the ball','The drop height','The crater depth','The unit of measurement'],0,'The same ball must be used each time so only the drop height changes.');
calc('m8c','m8',2,2,'Three parachute drops took 1.62 s, 1.58 s and 1.60 s. Calculate the mean time.',1.6,'s','Mean = (1.62 + 1.58 + 1.60) ÷ 3 = 4.80 ÷ 3 = 1.60 s',{units:['s','m','cm','N'],hints:['Add the three times together.','Divide the total by how many measurements there are (3).']});
mc('m8d','m8',3,'A pupil\'s repeats for one parachute are 1.1 s, 1.2 s, 1.1 s and 2.4 s. What should the pupil do?',['Identify 2.4 s as an anomaly, repeat that drop and exclude it from the mean','Include 2.4 s because every result must be used','Change the parachute','Delete the other three results'],0,'2.4 s is far from the others so it is an anomaly (probably a timing error). Repeat the measurement and calculate the mean without it.');
sh('m8e','m8',3,2,'Describe two ways to make the parachute investigation more reliable.','Repeat each drop at least three times and calculate a mean. Drop from the same height each time (and release the same way) and use video or a light gate for more accurate timing.',['Repeat measurements and calculate a mean (1)','Control other variables / use more accurate timing method (1)'],{kw:['repeat','mean','control variables','reliable']});
mc('m8f','m8',1,'Why do scientists repeat measurements?',['To spot anomalies and get a more reliable mean','To make the investigation longer','To change the independent variable','Because the results will always be wrong'],0,'Repeats show how close your results are and let you find anomalies.');
mc('m8g','m8',3,'Look at the graph from a crater investigation. Which conclusion does it support?',['The higher the ball is dropped from, the deeper the crater','The higher the drop, the shallower the crater','Crater depth does not depend on drop height','The ball gets lighter as it is dropped from higher'],0,'The points rise as drop height increases: a positive relationship.',{fig:crGraph()});
mc('m8h','m8',3,'Why would it be unfair to drop one parachute from a higher height than the others?',['Height would affect the time as well as the size, so you could not tell which caused the difference','Higher drops are more dangerous','Parachutes cannot be dropped from high up','It would make the parachutes heavier'],0,'Only the independent variable (size) should change. Changing the height too would mean the result could be caused by either variable.');

/* ---------- Module 9: Real world ---------- */
mc('m9a','m9',2,'What is the main cause of the tides in the oceans?',['The Moon\'s gravity pulling on the water','The Earth\'s magnetic field','Wind blowing across the sea','The Sun heating the water'],0,'The Moon pulls on the oceans, making water bulge towards it. (The Sun\'s pull is smaller because it is much further away.)');
mc('m9b','m9',3,'Why does a satellite stay in orbit around the Earth?',['Earth\'s gravity pulls it inwards while its sideways speed keeps it moving around the Earth','There is no gravity in space','It is pushed by the Moon','Rockets are always firing'],0,'The satellite is falling towards Earth all the time but it is also moving sideways so fast that the surface curves away below it.');
mc('m9c','m9',2,'There are far more visible craters on the Moon than on Earth. Which is a good reason?',['The Moon has almost no atmosphere or weather, so meteorites do not burn up and craters are not worn away','The Moon is closer to meteorites','There is no gravity on the Earth','The Moon is made of softer rock'],0,'Earth\'s atmosphere burns up many meteors, and weather, oceans and plants erase craters.');
calc('m9d','m9',2,2,'A rover with a mass of 900 kg lands on Mars where g = 3.7 N/kg. Calculate its weight on Mars.',3330,'N','W = m × g = 900 × 3.7 = 3330 N');
pr('m9e','m9',3,'A ball is dropped from the same height onto sand on the Moon and onto sand on Earth.',{opts:['The crater on the Moon is smaller','The crater on the Moon is bigger','The craters are the same size'],a:0},{q:'Which reason is best?',opts:['Weaker gravity means the ball hits at a lower speed with less energy','The Moon\'s sand is softer','The ball has more mass on the Moon'],a:0},'The ball speeds up more slowly where g is smaller, so it hits the sand slower with less energy.');
mc('m9f','m9',1,'Which of these is caused by gravity?',['Ocean tides','The Sun\'s light','Magnetism','Friction'],0,'The Moon\'s gravity causes tides. Gravity also holds the Moon in orbit and keeps us on the ground.');
mc('m9g','m9',2,'Engineers design the landing legs of a 500 kg lander for Mars (g = 3.7 N/kg). What weight must the legs support on Mars?',['1850 N','5000 N','185 N','500 N'],0,'W = 500 × 3.7 = 1850 N. (Not 5000 N – that is the weight on Earth.)');
sh('m9h','m9',3,3,'Suggest two ways in which gravity affects a space mission to Mars.','A rocket must produce enough force to overcome Earth\'s gravity at launch. The lander weighs less on Mars because Mars has a weaker gravitational field, so landing and take-off need less force. The Sun\'s and planets\' gravity affects the route the spacecraft follows.',['Powerful rockets needed to escape Earth\'s gravity (1)','Weight on Mars is smaller because g is smaller (1)','Gravity of the Sun/planets bends the path / orbit planning (1)'],{kw:['gravity','weight','orbit','gravitational field strength']});

/* ---------- retrieval questions (used in later modules) ---------- */
mc('r1','m1',1,'<b>Remember:</b> Which of these is a non-contact force?',['Gravity','Friction','Air resistance','A push from your hand'],0,'Gravity acts at a distance, so it is non-contact.',{tag:'From Module 1'});
mc('r2','m3',1,'<b>Remember:</b> Which quantity is measured in newtons?',['Weight','Mass','Distance','Time'],0,'Weight is a force, so it is measured in newtons.',{tag:'From Module 3'});
mc('r3','m4',2,'<b>Remember:</b> What is the weight of a 10 kg object on Earth (g = 10 N/kg)?',['100 N','10 N','1 N','1000 N'],0,'W = 10 × 10 = 100 N.',{tag:'From Module 4'});
tf('r4','m5',1,'<b>Remember:</b> Gravitational field strength gets weaker as you move further from a planet.',true,'The pull is strongest at the surface and falls with distance.',{tag:'From Module 5'});
mc('r5','m2',2,'<b>Remember:</b> Two equal forces of 12 N act in opposite directions on a box. What is the resultant force?',['0 N','24 N','12 N','6 N'],0,'Equal and opposite forces are balanced, so the resultant is 0 N.',{tag:'From Module 2'});
mc('r6','m7',1,'<b>Remember:</b> What is terminal velocity?',['The constant speed reached when air resistance equals weight','The fastest speed a rocket can reach','The speed at which a parachute opens','The speed of light'],0,'At terminal velocity the forces are balanced so the speed stays constant.',{tag:'From Module 7'});
mc('r7','m6',1,'<b>Remember:</b> Which planet has the strongest gravitational field of the eight planets?',['Jupiter','Mercury','Earth','Neptune'],0,'Jupiter is the largest, with g ≈ 25 N/kg.',{tag:'From Module 6'});
mc('r8','m1',2,'<b>Remember:</b> Earth pulls on the Moon. What does the Moon do to the Earth?',['Pulls on the Earth with a force of the same size','Does nothing','Pulls with a smaller force','Pushes the Earth away'],0,'Gravity always acts in pairs of equal size and opposite direction.',{tag:'From Module 1'});

/* ---------- Exam practice: Quick Check ---------- */
const EX='ex';
mc('qc1',EX,1,'Which equation links weight, mass and gravitational field strength?',['W = m × g','W = m ÷ g','m = W × g','g = m × W'],0,'Weight (N) = mass (kg) × gravitational field strength (N/kg).',{cat:'calc'});
mc('qc2',EX,1,'What is the unit of gravitational field strength?',['N/kg','kg','N','m/s'],0,'g is the force per kilogram, so its unit is newtons per kilogram.',{cat:'field'});
calc('qc3',EX,2,2,'A telescope has a mass of 15 kg. Calculate its weight on Mars where g = 3.7 N/kg.',55.5,'N','W = m × g = 15 × 3.7 = 55.5 N',{cat:'calc'});
lb('qc4',EX,1,'The diagram shows four planets. Label them 1–4.','solarLabel',[['1','Jupiter'],['2','Saturn'],['3','Neptune'],['4','Mars']],['Mars','Jupiter','Saturn','Neptune','Venus','Uranus'],'Order from the Sun: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.',{cat:'solar'});
mc('qc5',EX,2,'An object has a weight of 30 N on Earth (g = 10 N/kg). What is its mass?',['3 kg','300 kg','30 kg','0.3 kg'],0,'m = W ÷ g = 30 ÷ 10 = 3 kg.',{cat:'calc'});
mc('qc6',EX,2,'A boat has a forward force of 400 N and a backward drag force of 400 N. It is moving. What happens to its motion?',['It continues at a constant speed','It speeds up','It slows down','It stops at once'],0,'Balanced forces, zero resultant force: no change in motion.',{cat:'forces'});
pr('qc7',EX,3,'A spacecraft moves from 1 Earth radius to 3 Earth radii from the centre of the Earth.',{opts:['The gravitational field strength gets smaller','The gravitational field strength gets bigger','The gravitational field strength stays the same'],a:0},{q:'Which reason is best?',opts:['Gravity gets weaker as the distance from the Earth increases','The spacecraft loses mass','Gravity only acts on the surface'],a:0},'g falls with distance from the planet\'s centre. At 3 radii it is only one-ninth of the surface value.',{cat:'field'});
tf('qc8',EX,3,'A heavier object always falls faster than a lighter one.',false,'In a vacuum they fall together. In air, speed depends on weight and air resistance (shape and area), so a heavy but streamlined object may fall faster, but weight alone does not decide it.',{cat:'fall'});
mc('qc9',EX,3,'A pupil says: "There is no gravity on the International Space Station." Which fact shows the pupil is wrong?',['The station stays in orbit, which needs the Earth\'s gravity','Astronauts float','The station is very high up','The station has windows'],0,'Without gravity the station would fly off in a straight line. Gravity at the station is about 89% of the surface value.',{cat:'solar'});
sh('qc10',EX,3,2,'Explain why a parachutist falling at terminal velocity is not accelerating.','At terminal velocity the air resistance is equal in size and opposite in direction to the weight. The forces are balanced so the resultant force is zero, so there is no change in speed.',['Air resistance equals weight / forces are balanced (1)','Resultant force is zero so speed is constant (no acceleration) (1)'],{cat:'fall',kw:['balanced','resultant force','terminal velocity']});

mc('fr1',EX,1,'Which of these is a <b>contact</b> force?',['Air resistance','Gravity','Magnetism','Electrostatic force'],0,'Air resistance acts when the air touches the moving object.',{cat:'forces'});
tf('fr2',EX,1,'Mass is measured in newtons.',false,'Mass is measured in kilograms. Weight is measured in newtons.',{cat:'mw'});
mt('fr3',EX,1,'Match each keyword to its definition.',[['Weight','The force of gravity on an object'],['Mass','The amount of matter in an object'],['Gravitational field strength','The force from gravity on 1 kg'],['Gravitational field','The area where other objects feel a gravitational force']],'These are the core keywords from the unit.',{cat:'mw'});
od('fr4',EX,2,2,'Put these in order of gravitational field strength, starting with the lowest.',['Moon (1.6 N/kg)','Mars (3.7 N/kg)','Earth (10 N/kg)','Jupiter (25 N/kg)'],'The bigger the value of g, the stronger the pull on each kilogram.',{cat:'field'});
mc('fr5',EX,1,'What is the name for the curved path of a planet around the Sun?',['Orbit','Axis','Trajectory of light','Equator'],0,'An orbit is held in place by gravity.',{cat:'solar'});
tf('fr6',EX,1,'Gravity gets stronger as objects get further apart.',false,'Gravity gets weaker as the distance increases.',{cat:'attr'});
mc('fr7',EX,1,'What is the approximate gravitational field strength on the Moon?',['1.6 N/kg','10 N/kg','25 N/kg','0 N/kg'],0,'About one-sixth of Earth\'s value.',{cat:'field'});
calc('fr8',EX,2,2,'Calculate the weight of a 7.5 kg object on Earth. (g = 10 N/kg)',75,'N','W = 7.5 × 10 = 75 N',{cat:'calc'});
calc('fr9',EX,2,2,'An object weighs 33.3 N on Mars where g = 3.7 N/kg. Calculate its mass.',9,'kg','m = W ÷ g = 33.3 ÷ 3.7 = 9 kg',{cat:'calc'});
calc('fr10',EX,2,3,'A pupil of mass 60 kg stands on Jupiter where g = 25 N/kg. Calculate the pupil\'s weight. Show your working.',1500,'N','Equation: W = m × g<br>Substitute: W = 60 × 25<br>Calculate: W = 1500 N',{cat:'calc',working:true});
mc('fr11',EX,2,'Forces of 80 N to the right and 50 N to the left act on a trolley. What is the resultant force?',['30 N to the right','130 N to the right','30 N to the left','0 N'],0,'80 − 50 = 30 N in the direction of the bigger force.',{cat:'forces'});
mc('fr12',EX,2,'An astronaut weighs 800 N on Earth (g = 10 N/kg). What is her weight on the Moon (g = 1.6 N/kg)?',['128 N','800 N','80 N','8 N'],0,'Mass = 800 ÷ 10 = 80 kg. Weight on the Moon = 80 × 1.6 = 128 N.',{cat:'calc',hint:'Find her mass first, then use the Moon\'s g.'});
pr('fr13',EX,2,'A ball is dropped into sand from a greater height than before.',{opts:['The crater is deeper','The crater is shallower','The crater is the same depth'],a:0},{q:'Which reason is best?',opts:['The ball hits the sand at a higher speed with more energy','The ball has more mass','Sand is softer when it is higher up'],a:0},'A higher drop means more time to speed up and a bigger impact.',{cat:'inv'});
mc('fr14',EX,2,'Which pair of 1 kg masses has the stronger gravitational attraction between them?',['Masses 1 m apart','Masses 2 m apart','Masses 10 m apart','They are all the same'],0,'Closer objects attract more strongly.',{cat:'attr'});
lb('fr15',EX,2,'Label the arrows on the diagram.','earthMoonLabel',[['1','Force on the Moon (due to Earth)'],['2','Force on the Earth (due to the Moon)']],['Force on the Moon (due to Earth)','Force on the Earth (due to the Moon)','Force on the Earth (due to the Sun)'],'The two forces are equal in size and opposite in direction.',{cat:'attr'});
mc('fr16',EX,3,'Evaluate the claim: "Astronauts in orbit are weightless because they are too far from Earth for gravity to act."',['The claim is wrong: gravity is still about 89% as strong, and astronauts float because they are in free fall','The claim is correct','The claim is wrong: astronauts are close to the Moon','The claim is correct because there is no atmosphere'],0,'Gravity keeps the astronauts and the station in orbit. They float because everything is falling together.',{cat:'solar'});
sh('fr17',EX,3,3,'A pupil measures the weight of 1 kg masses at two locations and finds 10 N and 1.6 N. Identify the two locations and explain how you know.','The 10 N reading is on Earth and the 1.6 N reading is on the Moon. The weight of 1 kg in newtons is the gravitational field strength in N/kg. Earth\'s g is about 10 N/kg and the Moon\'s is about 1.6 N/kg.',['Earth (10 N) and Moon (1.6 N) (1)','Weight of 1 kg equals g in N/kg (1)','Matches known values: Earth about 10 N/kg, Moon about 1.6 N/kg (1)'],{cat:'mw',kw:['gravitational field strength','N/kg']});
sh('fr18',EX,3,4,'Explain why Jupiter has much stronger gravity than Mercury.','The strength of a planet\'s gravity (its gravitational field strength) depends on its mass. Jupiter has far more mass than Mercury, so Jupiter\'s g (about 25 N/kg) is much larger than Mercury\'s (about 3.7 N/kg). The same object therefore has a much bigger weight on Jupiter even though its mass is the same.',['The mass of a planet determines its gravitational field strength (1)','Jupiter has much more mass than Mercury (1)','So Jupiter\'s g is larger (about 25 compared with 3.7 N/kg) (1)','The same object weighs more on Jupiter although its mass is unchanged (1)'],{cat:'field',kw:['mass','gravitational field strength','weight']});
mc('fr19',EX,2,'Look at the speed–time graph for a skydiver. At about what time does the parachute open?',['20 s','5 s','35 s','0 s'],0,'Speed starts to fall sharply at 20 s – the parachute opens then.',{cat:'fall',fig:()=>Chart.svg(Sky.cfg(true))});
mc('fr20',EX,3,'A pupil plots weight (y-axis) against mass (x-axis) for objects on the Moon. What does the gradient of the line show?',['The Moon\'s gravitational field strength, 1.6 N/kg','The mass of the Moon','The distance to the Moon','The speed of falling objects'],0,'Weight ÷ mass = g, which is the gradient (change in y ÷ change in x).',{cat:'mw'});
sh('fr21',EX,3,4,'Compare the weight of a 70 kg astronaut on Earth (g = 10 N/kg), on the Moon (g = 1.6 N/kg) and on Jupiter (g = 25 N/kg). Explain why the weights are different when her mass stays the same.','Earth: 70 × 10 = 700 N. Moon: 70 × 1.6 = 112 N. Jupiter: 70 × 25 = 1750 N. Her mass is always 70 kg. Weight = mass × gravitational field strength and each body has a different field strength because it has a different mass.',['Earth 700 N and Moon 112 N (1)','Jupiter 1750 N (1)','Mass is constant (70 kg) (1)','Weight depends on g, which depends on the mass of the planet or moon (1)'],{cat:'calc',kw:['mass','weight','gravitational field strength']});
tf('fr22',EX,3,'If two objects are moved twice as far apart, the gravitational force between them stays the same.',false,'The force gets weaker as the distance increases (at twice the distance it is only one quarter).',{cat:'attr'});

/* ---------- Explain Like a Scientist ---------- */
sh('ex1',EX,3,4,'A pupil says: "My weight is smaller on the Moon because I have lost some mass." Explain what is wrong with the statement and give the correct explanation.','The pupil has not lost any mass. Mass is the amount of matter in a body and stays the same wherever it is. Weight is the force of gravity on the pupil. The Moon has less mass than Earth so its gravitational field strength (1.6 N/kg) is smaller than Earth\'s (10 N/kg). Since weight = mass × g, the weight is smaller even though the mass is unchanged.',['Mass does not change / has not been lost (1)','Weight is a force from gravity, measured in N (1)','Moon has a smaller gravitational field strength / less mass than Earth (1)','Weight = mass × g so weight decreases when g is smaller (1)'],{cat:'mw',kw:['mass','weight','gravitational field strength','W = m × g'],starters:['The pupil has not lost any mass because…','Weight is…','On the Moon g is…']});
sh('ex2',EX,3,6,'Describe and explain what happens to the speed of a skydiver from the moment she leaves the aircraft until she lands, including the opening of the parachute.','At first only weight acts so she accelerates downwards. As her speed increases air resistance increases, so the resultant force gets smaller. Eventually air resistance equals her weight, the forces are balanced and she falls at a constant terminal velocity. When the parachute opens, the surface area increases so air resistance becomes bigger than her weight. The resultant force is upwards and she slows down. As she slows, air resistance decreases until it equals her weight again, and she lands at a new, lower terminal velocity.',['At the start weight is bigger than air resistance and she accelerates (1)','Air resistance increases as speed increases (1)','Air resistance = weight, forces balanced, terminal velocity (constant speed) (1)','Parachute opens: bigger surface area gives bigger air resistance (1)','Air resistance > weight so she slows down (1)','Air resistance falls until balanced again at a lower terminal velocity (1)'],{cat:'fall',kw:['weight','air resistance','resultant force','terminal velocity','balanced'],starters:['At the start…','As speed increases…','When the parachute opens…']});
sh('ex3',EX,3,3,'Explain why planets that are further from the Sun take longer to orbit it.','Planets further away have a longer orbit (a longer path) to travel. The Sun\'s gravitational pull is weaker at greater distance, so they move more slowly. A longer distance travelled at a lower speed means a much longer orbit time.',['Further planets have a longer path / bigger orbit (1)','The Sun\'s gravitational pull is weaker at greater distance (1)','So they move more slowly, making the orbit time longer (1)'],{cat:'solar',kw:['orbit','gravity','distance','speed']});
sh('ex4',EX,3,4,'Ali says heavy objects fall faster than light ones. Beth says they fall at the same rate. Use ideas about forces to decide who is correct (a) in a vacuum and (b) in air.','(a) In a vacuum there is no air resistance. Weight is the only force, and all objects accelerate at the same rate, so Beth is correct. (b) In air, air resistance also acts. It depends on shape and surface area. A light object with a large surface area (a feather) reaches terminal velocity at a low speed, so it falls more slowly. Both can be partly right: neither is correct in every case.',['In a vacuum there is no air resistance (1)','Only weight acts so everything accelerates at the same rate: Beth is correct (1)','In air, air resistance acts and depends on surface area/shape (1)','So an object with a large area (e.g. a feather) falls more slowly than a compact one (1)'],{cat:'fall',kw:['vacuum','air resistance','weight','surface area']});
sh('ex5',EX,3,4,'Explain why the gravitational force between you and the Earth is much bigger than the force between you and the person next to you.','Gravitational force depends on the masses of the objects. The Earth has an enormous mass compared with a person, so the force between you and the Earth is large. A person next to you has a very small mass, so the force between you is tiny and far too small to notice. (Distance also matters: you are at the Earth\'s surface, close to its mass.)',['Gravitational force depends on the masses of the objects (1)','The Earth has an extremely large mass (1)','The other person has a very small mass so the force is tiny (1)','Distance also matters – force is bigger when objects are closer (1)'],{cat:'attr',kw:['mass','distance','gravitational force']});
sh('ex6',EX,3,4,'A pupil drops a ball into sand from 20 cm, 40 cm, 60 cm and 80 cm and measures the crater depth once at each height. Evaluate the method and suggest two improvements.','The method tests one variable (height) and measures depth, which is good. However, each height was only measured once so the results may not be reliable and anomalies cannot be spotted. Improvements: repeat each height at least three times and calculate a mean; keep the sand level and the same depth for each drop, use the same ball, and measure the depth the same way with a ruler at eye level.',['Positive: one variable changed / depth measured (1)','Weakness: only one measurement at each height, so not reliable/no anomaly check (1)','Improvement: repeat and calculate a mean (1)','Improvement: control variables (same ball, flat sand) / improve the measuring method (1)'],{cat:'inv',kw:['repeat','mean','reliable','control variables']});

 discover:{title:'Does the apple pull on the Earth?',html:'<p>The story goes that Isaac Newton watched an apple fall from a tree and wondered why it fell <i>down</i> and not sideways or upwards. He realised that the Earth must be <b>pulling</b> the apple. But then came a trickier question…</p><p>If the Earth pulls on the apple, does the apple pull on the Earth?</p>',fig:()=>D.earthMoon({arrows:false}),
  pred:{q:'Does the apple pull on the Earth?',opts:['No – only the Earth pulls','Yes – with a tiny force, exactly the same size as the Earth\'s pull on the apple','Yes – but with a much bigger force than the Earth\'s pull on the apple'],a:1,why:'Gravity acts between <b>both</b> objects. The apple pulls on the Earth with a force of the same size as the Earth\'s pull on the apple, in the opposite direction. The Earth does not visibly move because it has an enormous mass.'}},
 learn:[
 {h:'Gravity is a pull',html:'<p>{{gravity|Gravity}} is a {{force}} that <b>pulls</b> objects towards each other. It is measured in {{newton|newtons (N)}}.</p><p>Gravity is a {{noncontact|non-contact force}}: it works across empty space without the objects touching. Compare this with friction or air resistance, which are {{contact|contact forces}}.</p><div class="call remember"><b>Key idea</b>Gravity is always <b>attractive</b>. It only pulls. It never pushes.</div>',fig:()=>D.pair(2,2,4,{len:40})},
 {h:'Everything with mass pulls',html:'<p>Every object that has {{mass}} pulls on every other object – not just planets. You pull on this device, and on the person next to you!</p><p>You do not notice, because the force between two ordinary objects is <b>far too small</b>. You only feel the pull of something with a huge mass, like the Earth.</p><div class="call tip"><b>Big does not mean massive</b>A balloon is large but has very little mass. Mass is the amount of <i>stuff</i> (matter) in an object, not how big it looks.</div>'},
 {h:'More mass = stronger pull',html:'<p>The amount of gravitational force depends on <b>two things</b>. The first is the <b>mass of the objects</b>.</p><ul><li>The Earth has a huge mass, so its pull on you is strong.</li><li>The Moon has less mass than the Earth, so its pull is weaker.</li><li>Two pupils have tiny masses, so the pull between them is far too small to feel.</li></ul><p>More mass → stronger gravitational pull.</p>'},
 {h:'More distance = weaker pull',html:'<p>The second thing is the <b>distance</b> between the objects.</p><ul><li>The further apart two objects are, the <b>weaker</b> the pull between them.</li><li>Standing on the surface of a planet you are as close as possible, so you feel the strongest pull.</li><li>Move away and the pull gets weaker. It becomes very small, but it never switches off completely.</li></ul><div class="call tip"><b>Stretch</b>If you double the distance, the force becomes <b>four times weaker</b>. Halve the distance and it becomes four times stronger.</div>'},
 {h:'Forces come in pairs',html:'<p>When the Earth pulls on the Moon, the Moon pulls back on the Earth. The two forces are the <b>same size</b> but act in <b>opposite directions</b>.</p><p>That surprises many people. The Moon is smaller, but its pull on the Earth is not smaller: it is exactly as big as the Earth\'s pull on the Moon. (The Moon\'s pull on the Earth even lifts the oceans – you will see that in Module 9.)</p>',fig:()=>D.earthMoon(),ret:{q:'<b>Remember (Year 7 forces):</b> what is a force, and what unit do we use?',a:'A force is a push or a pull, measured in newtons (N).'}}],

 discover:{title:'A steady speed – so are there forces?',html:'<p>A car travels along a straight motorway at a steady 30 mph. The engine is working hard and the wheels are turning.</p><p>Are the forces on the car <b>balanced</b> or <b>unbalanced</b>?</p>',
  pred:{q:'The car moves at a steady speed in a straight line. What can you say about the forces acting on it?',opts:['The forwards force is bigger than the backwards force','The forces are balanced: equal in size and opposite in direction','There are no forces acting on it'],a:1,why:'Steady speed in a straight line means the resultant force is zero. The driving force equals the resistive forces (friction and air resistance). There are still forces – they are just balanced.'}},
 learn:[
 {h:'Forces are drawn as arrows',html:'<p>We show forces with <b>arrows</b>.</p><ul><li>The <b>length</b> of the arrow shows the <b>size</b> of the force (a longer arrow = a bigger force).</li><li>The <b>direction</b> of the arrow shows the direction the force acts.</li><li>Label every arrow with its name and size, for example <i>Weight 20 N</i>.</li><li>Only draw the forces acting <b>on</b> the object you are interested in.</li></ul>',fig:()=>D.forces({items:[{d:'up',len:60,c:'#2ee6c5',text:'Support force 20 N'},{d:'down',len:60,c:'#ffa24a',text:'Weight 20 N'}],floor:true,title:'A book on a table'})},
 {h:'Weight and air resistance',html:'<p>{{weight|Weight}} is the force of gravity on an object. It always acts <b>towards the centre of the Earth</b> (downwards).</p><p>{{drag|Air resistance (drag)}} is the force of the air pushing against a moving object. It acts in the <b>opposite direction</b> to the motion, and it gets bigger as the object goes faster or has a larger surface area.</p><div class="call remember"><b>Remember</b>Weight is a non-contact force. Air resistance is a contact force.</div>',fig:()=>D.forces({body:'sky',items:[{d:'down',len:80,c:'#ffa24a',text:'Weight'},{d:'up',len:50,c:'#2ee6c5',text:'Air resistance'}],title:'A falling skydiver'})},
 {h:'Balanced and unbalanced forces',html:'<p>When more than one force acts we find the <b>{{resultant|resultant force}}</b>: the single force that has the same effect as all the others added together.</p><ul><li><b>{{balanced|Balanced}}</b>: equal and opposite forces. The resultant is <b>0 N</b>.</li><li><b>{{unbalanced|Unbalanced}}</b>: forces are different. Resultant = bigger force − smaller force, in the direction of the bigger force.</li></ul><p>Example: driving force 70 N forwards, drag 45 N backwards → resultant = 70 − 45 = <b>25 N forwards</b>.</p>',fig:()=>`<div class="row" style="align-items:stretch">${D.forces({w:300,h:170,body:'box',items:[{d:'right',len:70,c:'#4db2ff',text:'50 N'},{d:'left',len:70,c:'#b196ff',text:'50 N'}],title:'Balanced: resultant 0 N'})}${D.forces({w:300,h:170,body:'box',items:[{d:'right',len:98,c:'#4db2ff',text:'70 N'},{d:'left',len:63,c:'#b196ff',text:'45 N'}],title:'Unbalanced: resultant 25 N →'})}</div>`},
 {h:'How forces change motion',html:'<div class="tbl"><table><thead><tr><th>Forces</th><th>What happens</th></tr></thead><tbody><tr><td>Balanced (resultant = 0)</td><td>An object at rest <b>stays at rest</b>. A moving object keeps moving at a <b>constant speed in a straight line</b>.</td></tr><tr><td>Resultant in the direction of motion</td><td>The object <b>speeds up</b>.</td></tr><tr><td>Resultant opposite to the motion</td><td>The object <b>slows down</b>.</td></tr><tr><td>Resultant at an angle to the motion</td><td>The object <b>changes direction</b>.</td></tr></tbody></table></div><div class="call warn"><b>Careful</b>Slowing down means there <i>is</i> a resultant force (opposite to the motion). Only <b>constant speed</b> or <b>rest</b> goes with zero resultant force.</div>'},
 {h:'Two common mistakes',html:'<div class="call warn"><b>Mistake 1</b>"If something is moving there must be a resultant force." <br><b>Truth:</b> an object can move at a constant speed when the forces are balanced.</div><div class="call warn"><b>Mistake 2</b>"Balanced forces mean nothing is happening." <br><b>Truth:</b> balanced forces mean the motion does not <i>change</i> – the object may be still, or moving at a steady speed.</div><p>A force is needed to <b>change</b> motion, not to keep it going.</p>',ret:{q:'<b>Remember (Module 1):</b> does gravity pull or push?',a:'It only pulls: gravity is an attractive force.'}}],

 explain:{prompt:'Explain why the reading on a balance stays the same but the reading on a newton meter changes when an object is moved from the Earth to the Moon.',starters:['A balance measures…','A newton meter measures…','The Moon has…'],hint:'Which quantity measures "how much stuff" and which measures a force? What does the Moon\'s gravity do?',model:'A balance measures mass, the amount of matter in the object, which does not change when the object moves to the Moon. A newton meter measures weight, the force of gravity on the object. The Moon has less mass than Earth, so its gravitational field strength is smaller (1.6 N/kg compared with 10 N/kg), so the weight is smaller.',ideas:['Said a balance measures mass, which stays the same','Said a newton meter measures weight (a force)','Said the Moon has a smaller gravitational field strength','Mentioned units (kg and N) correctly']},

 summary:['Mass: amount of matter, kg, balance, constant.','Weight: force of gravity on an object, N, newton meter, changes with location.','Earth g ≈ 10 N/kg; Moon g ≈ 1.6 N/kg.','An object has the same mass but a different weight on the Moon.'],
 misc:[['"Mass and weight are the same."','Different quantities, different units, different instruments.'],['"Weight is measured in kilograms."','Weight is a force: newtons. Kilograms measure mass.'],['"There is no weight in space."','Weight becomes very small far from planets, but gravity never disappears completely.']],

MC.m4={
 discover:{title:'How heavy is a litre of cola?',html:'<p>A 1-litre bottle of cola has a mass of about <b>1 kg</b>.</p><p>Gravity pulls on every kilogram. What is the weight of the bottle on Earth?</p>',
  pred:{q:'A 1 kg bottle of cola is on Earth. What is its weight?',opts:['1 N','10 N','100 N','1 kg'],a:1,why:'Each kilogram is pulled with about 10 N on Earth (g = 10 N/kg), so the weight is 1 × 10 = 10 N.'}},
 learn:[
 {h:'The weight equation',html:'<div class="eq">W = m × g</div><div class="tbl"><table><thead><tr><th>Symbol</th><th>Quantity</th><th>Unit</th></tr></thead><tbody><tr><td><b>W</b></td><td>Weight</td><td>newtons (N)</td></tr><tr><td><b>m</b></td><td>Mass</td><td>kilograms (kg)</td></tr><tr><td><b>g</b></td><td>Gravitational field strength</td><td>newtons per kilogram (N/kg)</td></tr></tbody></table></div><p>In words: weight (N) = mass (kg) × gravitational field strength (N/kg). The unit N/kg means "newtons of force for each kilogram".</p>'},
 {h:'A six-step method',html:'<ol><li><b>Identify</b> what you know and what you need.</li><li>Write the <b>equation</b>.</li><li><b>Substitute</b> the numbers.</li><li><b>Calculate</b> the answer.</li><li>Add the correct <b>unit</b>.</li><li>Do a <b>sense check</b>.</li></ol><div class="call remember"><b>Worked example</b>A 20 kg object is on the Moon (g = 1.6 N/kg). Weight?<br>1. Know m = 20 kg, g = 1.6 N/kg. Need W.<br>2. W = m × g<br>3. W = 20 × 1.6<br>4. W = 32<br>5. W = <b>32 N</b><br>6. On Earth it would be 200 N. The Moon\'s g is smaller, so 32 N is sensible ✓</div>'},
 {h:'Units must match',html:'<p>The equation only works if mass is in <b>kg</b>.</p><ul><li>Grams → kilograms: <b>divide by 1000</b>. (250 g = 0.25 kg)</li><li>Kilonewtons → newtons: <b>multiply by 1000</b>. (270 kN = 270 000 N)</li></ul><p>Example: a toy car has a mass of 250 g. On Earth: W = 0.25 × 10 = <b>2.5 N</b>.</p>'},
 {h:'Which g do I use?',html:gTable},
 {h:'Rearranging (stretch)',html:'<p>Sometimes you know the weight and need the mass or g.</p><div class="eq">m = W ÷ g &nbsp;&nbsp;&nbsp; g = W ÷ m</div><p>Example: Tom has a mass of 75 kg. His weight on an asteroid is 22.5 N. What is g there?<br>g = W ÷ m = 22.5 ÷ 75 = <b>0.3 N/kg</b>.</p>',fig:triFig,ret:{q:'<b>Remember (Module 3):</b> which unit is used for weight and which for mass?',a:'Weight: newtons (N). Mass: kilograms (kg).'}}],
 explore:{sim:'calcTutor',intro:'Work through a worked example, then guided practice, then on your own. The tutor gives hints, not answers.',pred:[],
  tasks:[['t1','Finish a <b>worked example</b>.'],['t2','Complete a <b>guided problem</b>.'],['t3','Complete an <b>on-your-own</b> problem.'],['t4','Complete a <b>stretch</b> problem (rearranging).']]},
 explain:{prompt:'Explain, step by step, how you would calculate the weight of a 30 kg child on Mars (g = 3.7 N/kg). Include the equation, the substitution, the answer and the unit.',starters:['First I would write the equation…','Next I substitute…','The answer is… with the unit…'],hint:'Use the six-step method: identify, equation, substitute, calculate, unit, sense check.',model:'Equation: weight = mass × gravitational field strength (W = m × g). Substitute: W = 30 kg × 3.7 N/kg. Calculate: W = 111. Unit: the weight is 111 N. Sense check: on Earth the child would weigh 300 N and Mars has a smaller g, so a smaller weight is sensible.',ideas:['Wrote the equation W = m × g','Substituted 30 and 3.7 correctly','Got 111 and wrote the unit N','Did or mentioned a sense check']},

 summary:['W = m × g (N = kg × N/kg).','Convert grams to kg (÷1000) before calculating.','Rearranged: m = W ÷ g and g = W ÷ m.','Always use the g for the planet in the question and finish with a sense check.'],
 misc:[['"Always use g = 10."','Use the g given for the place in the question.'],['"The unit of weight is kg."','Weight is in newtons.'],['"Multiply the mass in grams by g."','Convert to kg first.']],

/* ---- M5 ---- */
MC.m5={
 discover:{title:'Does gravity ever run out?',html:'<p>The Moon is 384 000 km from Earth, and yet it still orbits us. A satellite 36 000 km up still feels the Earth\'s pull.</p><p>How does gravity change as you travel away from a planet?</p>',
  pred:{q:'An astronaut moves from the Earth\'s surface to a place much further away. How does the Earth\'s pull on her change?',opts:['It gets weaker, but does not become zero','It gets stronger','It stays exactly the same','It stops completely as soon as she leaves the atmosphere'],a:0,why:'Gravity gets weaker with distance but never switches off.'}},
 learn:[
 {h:'A gravitational field',html:'<p>A {{field|gravitational field}} is the region around an object where other objects feel a force of gravity. Every object with mass has one. The field of a planet points towards its centre.</p>',fig:'fieldLines'},
 {h:'Field strength, g',html:'<p>{{g|Gravitational field strength}} tells you <b>how strong the field is</b>: it is the force of gravity on <b>each 1 kg</b> of mass. The unit is <b>N/kg</b>.</p><p>On Earth g ≈ 10 N/kg, so a 1 kg mass is pulled with 10 N, a 2 kg mass with 20 N and so on. That is where W = m × g comes from.</p>'},
 {h:'The mass of the planet matters',html:'<p>The more mass a planet has, the stronger its gravitational field.</p><ul><li>Jupiter has a huge mass: g ≈ <b>25 N/kg</b>.</li><li>Earth: g ≈ <b>10 N/kg</b>.</li><li>The Moon has much less mass: g ≈ <b>1.6 N/kg</b>.</li><li>Pluto has very little mass: g ≈ <b>0.6 N/kg</b>.</li></ul><p>The same object has the same mass everywhere but has a larger <b>weight</b> where g is larger.</p>'},
 {h:'Distance matters too',html:'<p>g is strongest at the surface and gets weaker as you go further away.</p>',fig:()=>Chart.svg({xmin:0,xmax:6,ymin:0,ymax:10,xt:1,yt:2,w:520,h:300,xlab:'Distance from centre of Earth (Earth radii)',ylab:'g (N/kg)',title:'g falls with distance',series:[{line:true,nomark:true,pts:Array.from({length:21},(_,i)=>[1+i*.25,10/Math.pow(1+i*.25,2)])}]})+'<ul><li>The curve drops steeply, then flattens.</li><li>It gets closer to zero but <b>never reaches it</b>.</li><li>Stretch: at 2× the distance from the centre, g is ¼ of its surface value.</li></ul>'},
 {h:'Weight changes with height',html:'<p>Because g changes with distance, your weight is very slightly smaller at the top of Mount Everest (g ≈ 9.77 N/kg) than at sea level (9.8 N/kg). A 1.2 kg bottle weighs about 11.7 N at the top.</p><div class="call remember"><b>Key idea</b>Your <b>mass</b> never changes. Your <b>weight</b> changes if g changes.</div>',ret:{q:'<b>Remember (Module 4):</b> what is the weight of a 10 kg object on Earth?',a:'W = 10 × 10 = 100 N.'}}],
 explore:{sim:'fieldExplorer',intro:'Move a spacecraft away from a planet like Earth and watch the field strength change. You can also change the planet\'s mass.',pred:[{q:'The surface g is 10 N/kg. What is g at <b>double</b> the distance from the planet\'s centre?',opts:['5 N/kg','2.5 N/kg','10 N/kg','20 N/kg'],a:1,why:'At twice the distance g is one quarter: 2.5 N/kg. (Not half.)'},{q:'A planet the same size as Earth but with <b>twice</b> the mass. What is g at its surface?',opts:['5 N/kg','10 N/kg','20 N/kg','40 N/kg'],a:2,why:'g is proportional to mass: twice the mass gives twice the g.'}],
  tasks:[['t1','Find the distance (2 radii) where g falls to a quarter of its surface value.'],['t2','Find a distance where g falls below <b>1 N/kg</b>.'],['t3','Jump to the <b>Moon\'s distance</b>. Is g zero?'],['t4','Double the planet\'s mass and compare g at the same distance.']]},
 explain:{prompt:'Describe and explain how the weight of an astronaut changes as she moves away from the Earth. Use the words <b>mass, gravitational field strength, distance</b> and <b>weight</b>.',starters:['As she moves away…','The gravitational field strength…','Her mass…'],hint:'Think about what stays the same (her mass) and what changes (g, and so her weight).',model:'As the astronaut moves further from the Earth the gravitational field strength gets weaker, because gravity decreases with distance. Her mass stays the same, but weight = mass × gravitational field strength, so her weight decreases. It becomes very small but never exactly zero.',ideas:['Said g (field strength) decreases with distance','Said mass stays the same','Said weight decreases because W = m × g','Said it never reaches zero']},
 practise:['m5a','m5b','m5c','m5d','m5e'],retr:['r3'],reflect:['m5f','m5g','m5h'],
 summary:['A gravitational field is the region where an object feels gravity.','g = force per kilogram (N/kg). Earth 10, Moon 1.6, Jupiter 25.','More mass → stronger field. More distance → weaker field (never zero).','Weight = m × g, so weight changes when g changes.'],
 misc:[['"Gravity stops in space."','It only gets weaker.'],['"g is the same everywhere."','It depends on the planet\'s mass and your distance from it.'],['"Mass changes with g."','Only weight changes.']],
 next:'Apply fields to the <b>Solar System</b>: orbits, other planets and astronauts that float.'};

MC.m6={
 discover:{title:'Why doesn\'t the Moon crash into the Earth?',html:'<p>The Earth pulls on the Moon all the time. So why does the Moon not simply fall down and hit us?</p>',fig:'earthMoon',
  pred:{q:'Why does the Moon not fall straight into the Earth?',opts:['It is too far away for gravity to act on it','It is moving sideways fast enough that it keeps missing the Earth as it falls','The Sun holds it up','There is no gravity in space'],a:1,why:'The Moon is falling towards the Earth all the time, but it is also moving sideways at high speed, so it keeps "missing" and goes round: an orbit.'}},
 learn:[
 {h:'Our Solar System',html:'<p>The {{solar|Solar System}} has one {{star}} (the Sun), eight {{planet|planets}} and many smaller objects. The Sun holds over 99% of the mass of the Solar System, so its gravity controls everything.</p><p><b>In order from the Sun:</b> Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.<br><i>My Very Educated Mother Just Served Us Nachos.</i></p><ul><li>{{terrestrial|Terrestrial (rocky) planets}}: Mercury, Venus, Earth, Mars</li><li>{{gasgiant|Gas giants}}: Jupiter, Saturn</li><li>{{icegiant|Ice giants}}: Uranus, Neptune</li><li>{{dwarf|Dwarf planets}}: Pluto, Ceres, Eris, Haumea, Makemake – they have not "cleared their orbit"</li></ul>',fig:planetsRow},
 {h:'Gravity on other worlds',html:'<p>Each planet has a different mass, so a different g. Jupiter, the biggest, has the strongest gravity of the planets (25 N/kg). Pluto has the weakest (0.6 N/kg).</p>'+gTable+'<p>A pupil with a mass of 45 kg would weigh 450 N on Earth, 1125 N on Jupiter and just 27 N on Pluto!</p>'},
 {h:'Why planets orbit',html:'<p>The Sun\'s gravity pulls each planet <b>towards the Sun</b>. But the planet is also moving <b>sideways</b>. The two together make a curved path: an {{orbit}}.</p><p>The planet is always falling towards the Sun, but it is moving sideways so fast that it keeps missing it. Orbits are slightly stretched circles (ellipses), nearly circular.</p>',fig:'orbit'},
 {h:'Orbit time and distance',html:'<div class="tbl"><table><thead><tr><th>Planet</th><th class="num">Distance (million km)</th><th class="num">Speed (km/s)</th><th class="num">Orbit time</th></tr></thead><tbody>'+PLANETS.map(p=>`<tr><td>${p}</td><td class="num">${PLANETS_ALL[p].dist}</td><td class="num">${PLANETS_ALL[p].spd}</td><td class="num">${PLANETS_ALL[p].per.replace(' (365.25 days)','')}</td></tr>`).join('')+'</tbody></table></div><ul><li>Further from the Sun → <b>longer</b> orbit time.</li><li>Further from the Sun → <b>slower</b> speed (the Sun\'s pull is weaker).</li></ul>'},
 {h:'Weightless astronauts?',html:'<p>On the International Space Station (400 km up), gravity is still about <b>89%</b> as strong as on the ground. The astronauts float because the station and astronauts are in {{freefall|free fall}} around the Earth: they all fall together.</p><p>This is {{weightless|apparent weightlessness}}. Gravity has not gone, and their <b>mass has not changed</b>. There is no "artificial gravity" on the ISS.</p>',ret:{q:'<b>Remember (Module 5):</b> how does gravitational field strength change as you move away from a planet?',a:'It gets weaker (but never reaches zero).'}}],
 explore:{sim:'solarSystem',intro:'Explore the planets, compare your weight on other worlds, launch a projectile into orbit and see why astronauts float.',pred:[{q:'A pupil has the same mass on every planet. On which of these would they weigh the most?',opts:['Mercury','Earth','Jupiter','Neptune'],a:2,why:'Jupiter has the largest g (25 N/kg), so the same mass has the biggest weight there.'}],
  tasks:[['t1','On the Orbit map, click at least <b>three</b> planets and compare their gravitational field strengths.'],['t2','In "Weight on other worlds", set a mass so that the weight on Jupiter is over <b>1000 N</b>.'],['t3','Launch the projectile at the speed that gives a <b>circular orbit</b>.'],['t4','Break the cable in "Floating astronauts" to see free fall.'],['t5','Open "Orbit data" and look for the pattern.']]},
 explain:{prompt:'Explain why astronauts float inside the International Space Station even though gravity there is still strong.',starters:['The astronauts and the station are…','Gravity is still…','This is called…'],hint:'Think about the lift with the broken cable. What is falling, and what is not pushing back on the astronaut?',model:'At the height of the ISS gravity is still about 89% as strong as on the ground. The station and the astronauts are in free fall: they are falling around the Earth together with the same acceleration, so there is no support force pushing on the astronauts. They feel weightless (apparent weightlessness) although gravity is still acting and their mass has not changed.',ideas:['Said gravity is still acting (not zero)','Said they are in free fall / falling around the Earth','Said the astronaut and the station fall together','Said mass is unchanged / they feel (apparently) weightless']},
 practise:['m6a','m6b','m6c','m6d','m6e'],retr:['r4'],reflect:['m6f','m6g','m6h'],
 summary:['Gravity from the Sun keeps the planets in orbit.','Planet order: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.','g differs on each planet: Jupiter strongest, Pluto weakest.','Orbit time increases (and speed decreases) with distance from the Sun.','Astronauts in orbit float because they are in free fall; gravity is still there.'],
 misc:[['"There is no gravity in space."','Gravity keeps the Moon and the planets in orbit.'],['"The ISS has artificial gravity."','It does not. Astronauts are in free fall.'],['"A planet\'s orbit takes the same time wherever it is."','Further planets take longer.']],
 next:'Next: what happens when gravity and <b>air resistance</b> compete – the skydiver.'};

MC.m7={
 discover:{title:'Why didn\'t Felix keep speeding up?',html:'<p>In 2012 Felix Baumgartner jumped from a balloon 39 km above the Earth. He reached over 1300 km/h – faster than the speed of sound – but he did not keep speeding up all the way to the ground.</p><p>What stopped him accelerating?</p>',
  pred:{q:'A skydiver jumps from a plane. After a long time in free fall, what happens to her speed?',opts:['It keeps increasing for ever','It reaches a maximum and then stays constant','It starts to decrease until she stops in the air','It decreases at first, then increases'],a:1,why:'Air resistance increases with speed until it equals her weight. Then the forces are balanced and her speed stays constant: terminal velocity.'}},
 learn:[
 {h:'Two forces on a falling object',html:'<p>Two forces act on a skydiver: <b>weight</b> (gravity) pulling down and <b>air resistance</b> pushing up against the motion.</p><p>Weight stays the same all the way down (about 800 N for a skydiver with equipment). Air resistance is not constant: it depends on speed and shape.</p>',fig:()=>D.forces({body:'sky',items:[{d:'down',len:80,c:'#ffa24a',text:'Weight'},{d:'up',len:50,c:'#2ee6c5',text:'Air resistance'}],title:'Falling skydiver'})},
 {h:'Speeding up',html:'<p>At the start she is moving slowly, so air resistance is tiny. Weight is bigger than air resistance, so there is a downwards <b>resultant force</b> and she accelerates.</p><p>As her speed increases, air resistance increases. The resultant force gets smaller, so she accelerates less and less.</p>'},
 {h:'Terminal velocity',html:'<p>Eventually air resistance <b>equals</b> her weight. The forces are balanced, the resultant force is zero, and her speed stays <b>constant</b>. This is {{terminal|terminal velocity}} (about 55 m/s ≈ 200 km/h for a skydiver in a spread position).</p><div class="call warn"><b>Notice</b>Equal forces do <b>not</b> mean she has stopped. She is still falling very fast – but her speed is no longer changing.</div>'},
 {h:'Opening the parachute',html:'<p>When the parachute opens, the surface area suddenly increases, so air resistance becomes much <b>bigger than weight</b>. The resultant force is <b>upwards</b>, so she slows down.</p><p>As she slows, air resistance falls until it equals her weight again. The forces balance at a much lower speed: a new, lower terminal velocity (about 5 m/s), which is slow enough to land safely.</p>',fig:stagesFig},
 {h:'Do heavier things fall faster?',html:'<p>In a {{vacuum}} (no air) there is no air resistance, so a hammer and a feather fall together. Astronaut David Scott showed this on the Moon in 1971.</p><p>In air it depends on weight <i>and</i> air resistance. A feather has a large surface area compared with its weight, so air resistance balances its weight at a low speed. A hammer reaches a much higher terminal velocity.</p>',ret:{q:'<b>Remember (Module 2):</b> what is the resultant of two equal and opposite forces?',a:'Zero – the forces are balanced.'}}],
 explore:{sim:'parachutist',intro:'Run the four stages of a skydive one at a time. Before each stage you will be asked to predict what will happen.',pred:[],tasks:[['t1','Complete all <b>four stages</b> with a prediction for each.'],['t2','Use the slider to replay the jump and find a moment where the arrows are equal but the skydiver is still moving.']]},
 explain:{prompt:'Explain, using the words <b>weight, air resistance</b> and <b>resultant force</b>, why a skydiver falls at a constant speed when she reaches terminal velocity.',starters:['At terminal velocity the air resistance is…','The resultant force is…','So the skydiver…'],hint:'Think about what you learned in Module 2 about balanced forces.',model:'At terminal velocity the air resistance is equal in size to the skydiver\'s weight and acts in the opposite direction. The forces are balanced so the resultant force is zero. With no resultant force her speed does not change, so she falls at a constant speed.',ideas:['Said air resistance equals weight','Said the forces are balanced / resultant force is zero','Said the speed is constant because there is no resultant force','Said she is still moving (not stationary)']},
 practise:['m7a','m7b','m7c','m7d','m7e'],retr:['r5'],reflect:['m7f','m7g','m7h'],
 summary:['Weight (down) and air resistance (up) act on a falling object.','Air resistance increases with speed until it equals weight: terminal velocity.','At terminal velocity the forces are balanced and speed is constant.','A parachute increases air resistance so the skydiver slows to a lower terminal velocity.','In a vacuum all objects fall together.'],
 misc:[['"Heavier objects always fall faster."','Only in air, and it depends on air resistance too.'],['"Terminal velocity means stopped."','It means constant speed.'],['"Gravity gets weaker as you fall."','Weight stays about the same; air resistance changes.']],
 next:'Now <b>test</b> ideas like these in two virtual investigations: parachutes and craters.'};

MC.m8={
 discover:{title:'Can you prove a bigger parachute is slower?',html:'<p>You think a bigger parachute will fall more slowly. A friend says it will not make any difference. How can you <b>prove</b> who is right?</p>',
  pred:{q:'Which is the best plan to test whether a bigger parachute falls more slowly?',opts:['Drop a big and a small parachute from different heights','Change only the parachute size and keep everything else the same','Drop one parachute once and trust the result','Change the size and the string length together'],a:1,why:'To be a fair test you change one variable (size), measure one thing (time) and keep everything else the same.'}},
 learn:[
 {h:'Predictions and hypotheses',html:'<p>A {{prediction}} says what you think will happen. A {{hypothesis}} adds a scientific reason: <i>"If I increase the size of the parachute, then it will take longer to fall because there is more air resistance."</i></p>'},
 {h:'Variables and fair tests',html:'<ul><li>{{iv|Independent variable}}: the one thing you <b>change</b>.</li><li>{{dv|Dependent variable}}: what you <b>measure</b>.</li><li>{{cv|Control variables}}: everything you keep the <b>same</b>.</li></ul><div class="tbl"><table><thead><tr><th></th><th>Parachutes</th><th>Craters</th></tr></thead><tbody><tr><td>Independent</td><td>Parachute size</td><td>Drop height</td></tr><tr><td>Dependent</td><td>Time to fall</td><td>Crater depth</td></tr><tr><td>Control</td><td>Drop height, bin-bag material, string length, blue tack, same timer</td><td>Ball (mass/size), sand depth, tray, measuring method</td></tr></tbody></table></div><p>A {{fair|fair test}} changes only the independent variable.</p>'},
 {h:'Repeats, means and anomalies',html:'<ul><li><b>Repeat</b> each measurement (at least 3 times).</li><li>Calculate the {{mean}}: add up and divide by the number of repeats.</li><li>An {{anomaly}} is a result that does not fit the pattern (a mistake). Repeat it or leave it out.</li><li>Results are {{reliable}} if repeats are close together.</li></ul><div class="call remember"><b>Example</b>Repeats 1.62 s, 1.58 s and 1.60 s → mean = 4.80 ÷ 3 = 1.60 s.</div>'},
 {h:'Tables and graphs',html:'<ul><li>Table headings must include <b>units</b>. Leave columns for repeats and the mean.</li><li>The <b>independent</b> variable goes on the <b>x-axis</b>; the <b>dependent</b> variable on the <b>y-axis</b>.</li><li>Choose an even scale. Label both axes with units.</li><li>Plot the means, then draw a <b>line or curve of best fit</b> – do not just join the dots.</li></ul><p>If you measure the average speed: speed = distance ÷ time.</p>'},
 {h:'Conclusions and evaluation',html:'<p>A good <b>conclusion</b> states the pattern in your results, quotes the data, and <b>explains it with science</b>.</p><p>A good <b>evaluation</b> mentions anomalies, how reliable the results were, and gives improvements: more repeats, more accurate timing, better control of variables.</p>'},
 {h:'The crater practical',html:'<p><b>Safety:</b> wear goggles; sand in the eyes is dangerous.</p><ol><li>Half-fill a tray with sand.</li><li>Stand a metre rule next to the tray.</li><li>Drop a ball from 20 cm.</li><li>Remove the ball and measure the depth of the crater.</li><li>Record, then repeat for 40, 60, 80 and 100 cm.</li></ol><p>Higher drop → faster impact and more energy → deeper crater.</p>',ret:{q:'<b>Remember (Module 7):</b> what is terminal velocity?',a:'The constant speed reached when air resistance equals weight.'}}],
 explore:{sims:[['invParachute'],['invCrater']],intro:'Complete both investigations from planning to evaluation. All data are <b>simulated</b>.',pred:[],tasks:[['t1','Complete the <b>parachute</b> investigation.'],['t2','Complete the <b>crater</b> investigation.']]},
 explain:{prompt:'A pupil wants to find out if the drop height changes the size of a crater. Plan the investigation. State what will be changed, what will be measured and what will be kept the same, and how to make the results reliable.',starters:['The independent variable is…','I will measure…','I will keep… the same','To make it reliable I will…'],hint:'Think: change one thing, measure one thing, control the rest, repeat and average.',model:'I will change the drop height (independent variable), for example 20, 40, 60, 80 and 100 cm. I will measure the depth of the crater (dependent variable) with a ruler. I will keep the same ball, the same depth of smooth sand and the same way of measuring (control variables). I will repeat each height at least three times and calculate a mean to make the results reliable.',ideas:['Said drop height is the independent variable','Said crater depth is measured','Named at least two control variables','Mentioned repeats and a mean']},
 practise:['m8a','m8b','m8c','m8d','m8e'],retr:['r6'],reflect:['m8f','m8g','m8h'],
 summary:['Independent variable: change. Dependent: measure. Control: keep the same.','Repeat measurements, calculate means, look for anomalies.','Independent variable on the x-axis, dependent on the y-axis.','Conclusions state the pattern and explain it with science.'],
