<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 7 Gravity – Interactive Learning</title>
<meta name="description" content="Year 7 Physics 7P1 Gravity: an interactive learning and revision platform. Works offline.">
<style>
:root{--bg:#070d27;--bg2:#0c1535;--card:#121c48;--card2:#1a2766;--line:#34458f;--text:#eef2ff;--muted:#b9c4f0;--blue:#4db2ff;--teal:#2ee6c5;--purple:#b196ff;--orange:#ffa24a;--yellow:#ffd23f;--ok:#2ee6c5;--no:#ffa24a;--r:16px;--sh:0 8px 28px rgba(0,0,10,.35)}
*{box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth}
html.big{font-size:18.5px}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--text);line-height:1.55;background:radial-gradient(1100px 560px at 85% -10%,#2a3aa066,transparent),radial-gradient(900px 520px at -10% 105%,#6a2fb055,transparent),var(--bg);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(1.2px 1.2px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 90px,#cfe3ff,transparent),radial-gradient(1.4px 1.4px at 220px 20px,#fff,transparent),radial-gradient(1px 1px at 300px 140px,#ffeab0,transparent),radial-gradient(1.2px 1.2px at 70px 170px,#fff,transparent);background-size:340px 200px}
a{color:var(--blue)}
h1,h2,h3,h4{line-height:1.2;margin:.2em 0 .5em}
h1{font-size:1.9rem}h2{font-size:1.45rem}h3{font-size:1.15rem}
p{margin:.5em 0 .8em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--yellow);color:#000;padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;position:relative}
nav#side{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,#0b1340,#0a1030);border-right:1px solid var(--line);padding:14px 12px 20px;z-index:20}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;font-weight:800;font-size:1.15rem;letter-spacing:.2px}
.brand b{background:linear-gradient(90deg,var(--blue),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.navlist{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.navlist a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;color:var(--text);text-decoration:none;font-size:.95rem}
.navlist a:hover{background:#ffffff14}
.navlist a[aria-current=page]{background:linear-gradient(90deg,#2b4fd0,#2a2f8f);box-shadow:inset 0 0 0 1px #6f8bff}
.navlist .tick{margin-left:auto;font-size:.8rem;color:var(--teal);font-weight:700;white-space:nowrap}
.navsep{margin:12px 8px 4px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.navfoot{margin-top:16px;padding:8px}
main{padding:0 0 60px;min-width:0}
.top{position:sticky;top:0;z-index:15;display:flex;gap:10px;align-items:center;padding:10px 22px;background:#080e2ccc;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .grow{flex:1}
.menu{display:none}
.ring{--p:0;width:42px;height:42px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),#2a3677 0);display:grid;place-items:center;flex:none}
.ring span{width:32px;height:32px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:.7rem;font-weight:700}
.page{max-width:1080px;margin:0 auto;padding:22px}
.btn{font:inherit;font-weight:650;border:1px solid var(--line);background:var(--card2);color:var(--text);padding:9px 16px;border-radius:12px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:#243386}
.btn.primary{background:linear-gradient(90deg,#1d7bff,#2a55e0);border-color:#6fa0ff}
.btn.primary:hover{filter:brightness(1.12)}
.btn.teal{background:linear-gradient(90deg,#14c9a8,#1099c9);color:#03131a;border-color:#6bf2da}
.btn.ghost{background:transparent}
.btn.small{padding:5px 11px;min-height:34px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.warn{border-color:var(--orange);color:var(--orange);background:transparent}
.card{background:linear-gradient(180deg,var(--card),#0f1740);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);margin:0 0 16px}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:center;background:linear-gradient(120deg,#1a2a8c,#3b1d7a 60%,#14587a);border-radius:22px;padding:26px 28px;border:1px solid #5d74ff88;margin-bottom:18px;overflow:hidden}
.hero h1{font-size:2.1rem;margin:0 0 8px}
.hero p{color:#dfe6ff}
.mod{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--text);background:linear-gradient(180deg,#16225a,#101847);border:1px solid var(--line);border-radius:20px;padding:16px;min-height:160px;transition:transform .15s,border-color .15s}
.mod:hover{transform:translateY(-3px);border-color:var(--blue)}
.mod .ic{font-size:2rem}
.mod h3{margin:0;font-size:1.05rem}
.mod p{margin:0;color:var(--muted);font-size:.88rem}
.bar{height:9px;background:#2a3677;border-radius:9px;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#16225a;color:var(--text);font-size:.88rem;text-decoration:none;font-weight:600}
.chip[aria-current=step]{background:linear-gradient(90deg,#2b4fd0,#6a3fd0);border-color:#9bb0ff}
.chip.done:after{content:"✓";color:var(--teal);font-weight:800}
.badge{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:8px;letter-spacing:.04em}
.ao1{background:#1d4e89;color:#cfe6ff}.ao2{background:#5b3a9e;color:#e6dcff}.ao3{background:#8a4b00;color:#ffe3bd}
.call{border-left:5px solid var(--blue);background:#14205a;border-radius:0 14px 14px 0;padding:11px 16px;margin:12px 0}
.call.predict{border-color:var(--purple);background:#221a5e}
.call.remember{border-color:var(--teal);background:#0f2f4a}
.call.warn{border-color:var(--orange);background:#3a2410}
.call.tip{border-color:var(--yellow);background:#2e2a12}
.call>b:first-child{display:block;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.eq{font-size:1.5rem;font-weight:800;text-align:center;padding:12px;border-radius:14px;background:#0a1236;border:2px dashed var(--teal);margin:12px 0;letter-spacing:.03em}
.q{background:#0e1744;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 14px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:.85rem;color:var(--muted)}
.qn{font-weight:800;color:var(--text)}
.qt{font-size:1.04rem;margin-bottom:8px}
.qfig{margin:6px 0}
.qfig svg,.fig svg{max-width:100%;height:auto;background:#081032;border-radius:12px;border:1px solid #28367d}
.opts{border:0;padding:0;margin:0;display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#121d52;cursor:pointer}
.opt:hover{background:#18266a}
.opt input{margin-top:5px;accent-color:var(--blue);width:18px;height:18px;flex:none}
.opt.right{border-color:var(--ok);background:#0b3a45}
.opt.right:after{content:"✓ correct";margin-left:auto;color:var(--ok);font-weight:800;white-space:nowrap}
.opt.wrong{border-color:var(--no);background:#40260f}
.opt.wrong:after{content:"✗";margin-left:auto;color:var(--no);font-weight:800}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px;background:#0b1a46;border:1px solid var(--line)}
.fb.good{border-color:var(--ok);background:#0a3341}
.fb.bad{border-color:var(--no);background:#3a210c}
.fb b.t{display:block}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--text);background:#0a1236;border:1px solid #4a5cb0;border-radius:10px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:110px}
input[type=number]{width:110px}
input[type=range]{width:100%;accent-color:var(--teal);min-height:34px}
select{max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.matchrow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(160px,1.3fr) 28px;gap:8px;align-items:center;margin:6px 0}
.sim{position:relative;border:1px solid #4a5cb0;border-radius:18px;padding:14px;background:linear-gradient(180deg,#0d1646,#090f33);margin:12px 0}
.sim h3{margin-top:0}
.sim[inert]{opacity:.35;filter:grayscale(.5)}
.lockmsg{background:#2b1f5e;border:1px dashed var(--purple);border-radius:12px;padding:10px 14px;margin:10px 0}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 18px;margin:10px 0}
.ctl label{display:block;font-weight:650;font-size:.92rem}
.ctl output{color:var(--teal);font-weight:800}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px;padding:0;list-style:none}
.tabs button{font:inherit;font-weight:650;background:#16225a;color:var(--text);border:1px solid var(--line);padding:7px 13px;border-radius:10px;cursor:pointer;min-height:38px}
.tabs button[aria-selected=true]{background:linear-gradient(90deg,#2b4fd0,#6a3fd0);border-color:#9bb0ff}
.read{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.read div{background:#0a1236;border:1px solid #3a4b9a;border-radius:12px;padding:8px 12px}
.read small{display:block;color:var(--muted);font-size:.78rem}
.read strong{font-size:1.25rem;color:var(--yellow)}
.task{display:flex;gap:10px;align-items:flex-start;margin:5px 0}
.task .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--teal);flex:none;display:grid;place-items:center;font-size:.85rem;color:#031;margin-top:2px}
.task.on .bx{background:var(--teal)}
.task.on span{text-decoration:line-through;text-decoration-color:#2ee6c588;opacity:.85}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.93rem}
th,td{border:1px solid #3a4b9a;padding:6px 9px;text-align:left}
th{background:#1a2766}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
button.term{font:inherit;color:var(--yellow);background:none;border:0;border-bottom:2px dotted var(--yellow);padding:0;cursor:help;font-weight:650}
#pop{position:fixed;z-index:90;max-width:290px;background:#fff;color:#0a1030;border-radius:12px;padding:10px 13px;box-shadow:0 10px 30px #000a;font-size:.9rem;display:none}
#pop b{display:block;color:#1c3bd0}
svg text{font-family:inherit}
.alab{font-size:13px;font-weight:700}
.sv{font-size:12px;fill:#cfe0ff}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:#34458f}
.dots i.on{background:var(--blue)}
.dots i.cur{background:var(--yellow);transform:scale(1.25)}
.stat{background:#0a1236;border:1px solid #3a4b9a;border-radius:14px;padding:12px 14px}
.stat b{font-size:1.6rem;display:block}
.hbar{display:grid;grid-template-columns:130px 1fr 70px;gap:8px;align-items:center;margin:4px 0;font-size:.9rem}
.hbar .tr{height:16px;background:#1f2b6c;border-radius:8px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--blue),var(--blue) 8px,#2d8fe0 8px,#2d8fe0 16px)}
.hbar.low .tr i{background:repeating-linear-gradient(45deg,var(--orange),var(--orange) 8px,#e08a2d 8px,#e08a2d 16px)}
.hbar.low{}
.flip{perspective:900px}
.reveal{border:1px dashed var(--teal);border-radius:12px;padding:10px 14px;margin:8px 0;background:#0a2438}
details{margin:8px 0}
summary{cursor:pointer;font-weight:650;color:var(--teal)}
.sim-note{font-size:.82rem;color:var(--muted)}
.simtag{display:inline-block;background:#3b2a00;color:var(--yellow);border:1px solid var(--yellow);border-radius:8px;padding:1px 8px;font-size:.75rem;font-weight:800}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.stp{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:#0e1744}
.stp.cur{border-color:var(--blue);box-shadow:0 0 0 2px #4db2ff44}
.stp.dn{border-color:var(--ok)}
.stp h4{margin:0 0 6px}
.tag{font-size:.75rem;background:#2a3677;border-radius:7px;padding:2px 7px;margin-left:6px}
dialog{background:#10194a;color:var(--text);border:1px solid var(--blue);border-radius:16px;padding:20px;max-width:440px}
dialog::backdrop{background:#000a}
.glo{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.glo article{background:#0e1744;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.glo h4{margin:0;color:var(--yellow)}
.fcard{min-height:130px;background:#16225a;border:2px solid var(--blue);border-radius:16px;padding:22px;text-align:center;font-size:1.1rem;cursor:pointer;display:grid;place-items:center;width:100%;color:var(--text);font:inherit}
@media (max-width:960px){
 .app{grid-template-columns:1fr}
 nav#side{position:fixed;left:0;top:0;bottom:0;width:276px;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--sh)}
 nav#side.open{transform:none}
 .menu{display:inline-flex}
 .hero{grid-template-columns:1fr}
 .page{padding:16px}
 .top{padding:8px 14px}
 .hbar{grid-template-columns:90px 1fr 60px}
 .matchrow{grid-template-columns:1fr}
}
@media (max-width:520px){h1{font-size:1.5rem}.hero h1{font-size:1.6rem}.card{padding:14px}.page{padding:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
html.calm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@keyframes pulse{50%{opacity:.5}}
.pulse{animation:pulse 1.6s infinite}
@media print{nav#side,.top,.actions,.btn{display:none!important}.app{display:block}body{background:#fff;color:#000}}
.top .menu{display:none}
@media (max-width:960px){.top .menu{display:inline-flex}}
h1:focus{outline:none}

</style>

<body>
<a class="skip" id="mainlink" href="#view">Skip to main content</a>
<div class="app">
<nav id="side" aria-label="Main navigation"></nav>
<main>
<header class="top"><button type="button" class="btn small menu" id="menu" aria-label="Open menu" aria-expanded="false" aria-controls="side">☰ Menu</button><span class="grow"><b>Year 7 Physics · 7P1 Gravity</b></span><div class="ring" role="img" aria-label="Overall progress"><span>0%</span></div></header>
<div class="page"><p id="nosave" class="lockmsg" hidden>Your browser is blocking saving, so your progress will be lost when you close this page.</p><div id="view" aria-live="off"></div></div>
</main>
</div>
<div id="pop" role="tooltip" style="display:none"></div>
<dialog id="setdlg" aria-label="Settings"></dialog>
<dialog id="rstdlg" aria-label="Reset progress"></dialog>
<noscript><p style="padding:20px;color:#fff">This learning platform needs JavaScript to be turned on.</p></noscript>
<script>
'use strict';
/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,d=2)=>{const s=(+n).toFixed(d);return s.includes('.')?s.replace(/\.?0+$/,''):s;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let _uid=0;const nid=p=>p+(++_uid);
const STAGES=['discover','learn','explore','explain','practise','reflect'];
const STAGE_NAMES={discover:'Discover',learn:'Learn',explore:'Explore',explain:'Explain',practise:'Practise',reflect:'Reflect'};

/* ===== store ===== */
const KEY='y7gravity.v1';
const blank=()=>({v:1,st:{},conf:{},q:{},calc:{n:0,ok:0,lv:{}},myth:{},inv:{},exam:{},expl:{},draft:{},set:{reduce:false,big:false},visits:0});
let S=blank(),canSave=true;
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1)S=Object.assign(blank(),o);}}catch(e){canSave=false;}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){canSave=false;}};
const P={
 stage:(m,s)=>!!(S.st[m]&&S.st[m][s]),
 setStage(m,s){if(!P.stage(m,s)){(S.st[m]=S.st[m]||{})[s]=1;save();if(window.renderNav)renderNav();}},
 stagesDone:m=>STAGES.filter(s=>P.stage(m,s)).length,
 modDone:m=>P.stagesDone(m)===STAGES.length,
 rec(q,frac){if(!q.id)return;const r=S.q[q.id]=S.q[q.id]||{n:0,h:[]};r.n++;r.last=+frac.toFixed(2);r.h.push(r.last);if(r.h.length>6)r.h.shift();save();},
 recCalc(ok,lv){S.calc.n++;if(ok)S.calc.ok++;if(lv){const l=S.calc.lv[lv]=S.calc.lv[lv]||{n:0,ok:0};l.n++;if(ok)l.ok++;}save();},
 catStats(){const o={};for(const id in S.q){const q=QB[id];if(!q)continue;const c=o[q.cat]=o[q.cat]||{n:0,s:0};c.n++;c.s+=S.q[id].last;}
  if(S.calc.n){const c=o.calc=o.calc||{n:0,s:0};c.n+=S.calc.n;c.s+=S.calc.ok;}
  return o;},
 aoStats(){const o={1:{n:0,s:0},2:{n:0,s:0},3:{n:0,s:0}};for(const id in S.q){const q=QB[id];if(!q)continue;o[q.ao].n++;o[q.ao].s+=S.q[id].last;}return o;},
 wrong(){return Object.keys(S.q).filter(id=>QB[id]&&S.q[id].last<1);},
 mythDone:()=>Object.keys(S.myth).filter(k=>S.myth[k].done).length,
 examDone:()=>['quick','full','calc','explain'].filter(k=>S.exam[k]&&S.exam[k].done).length,
 units(){let d=0;MODS.forEach(m=>d+=P.stagesDone(m.id));d+=P.mythDone()+P.examDone();return d;},
 total:()=>MODS.length*6+MYTHS.length+4,
 overall(){return Math.round(100*P.units()/P.total());}
};

/* ===== glossary popover ===== */
const T=s=>String(s).replace(/\{\{([\w-]+)(?:\|([^}]+))?\}\}/g,(m,k,l)=>GLOSS[k]?`<button type="button" class="term" data-term="${k}">${l||GLOSS[k].t.toLowerCase()}</button>`:(l||k));
function hidePop(){const p=$('#pop');if(p)p.style.display='none';}
document.addEventListener('click',e=>{const t=e.target.closest('.term');const p=$('#pop');if(!t){hidePop();return;}
 const g=GLOSS[t.dataset.term];p.innerHTML=`<b>${esc(g.t)}</b>${g.d}`;p.style.display='block';
 const r=t.getBoundingClientRect();p.style.left=clamp(r.left,8,innerWidth-p.offsetWidth-8)+'px';p.style.top=(r.bottom+6+p.offsetHeight>innerHeight?Math.max(8,r.top-p.offsetHeight-6):r.bottom+6)+'px';});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hidePop();});
window.addEventListener('scroll',hidePop,{passive:true});

/* ===== motion ===== */
const Motion={get on(){return !(S.set.reduce||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches));}};
const rafs=new Set();
function loop(fn){let id,last=performance.now(),dead=false;const f=t=>{if(dead)return;const dt=Math.min(.1,(t-last)/1000);last=t;if(fn(dt)===false){dead=true;return;}id=requestAnimationFrame(f);};id=requestAnimationFrame(f);const h={stop(){dead=true;cancelAnimationFrame(id);rafs.delete(h);}};rafs.add(h);return h;}
function stopLoops(){rafs.forEach(h=>h.stop());rafs.clear();}

/* ===== SVG helpers ===== */
function arrow(x1,y1,x2,y2,o={}){const c=o.c||'#4db2ff',w=o.w||4;const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);if(L<2)return '';
 const ux=dx/L,uy=dy/L,hs=Math.min(13,L*.7),bx=x2-ux*hs,by=y2-uy*hs,px=-uy,py=ux;
 const head=`M${x2},${y2}L${bx+px*hs*.5},${by+py*hs*.5}L${bx-px*hs*.5},${by-py*hs*.5}Z`;
 return `<g><line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${o.dash?' stroke-dasharray="7 5"':''}/><path d="${head}" fill="${c}"/>${o.label?`<text x="${o.lx??x2}" y="${o.ly??y2-8}" fill="${o.tc||c}" text-anchor="${o.anchor||'middle'}" class="alab">${o.label}</text>`:''}</g>`;}
const svgOpen=(w,h,label)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(label||'diagram')}">`;
const Chart={svg(c){const W=c.w||520,H=c.h||320,ml=60,mr=20,mt=20,mb=52,iw=W-ml-mr,ih=H-mt-mb;
 const X=x=>ml+(x-c.xmin)/(c.xmax-c.xmin)*iw,Y=y=>mt+ih-(y-c.ymin)/(c.ymax-c.ymin)*ih;
 let s=svgOpen(W,H,c.title||'graph');
 const xt=c.xt||(c.xmax-c.xmin)/5,yt=c.yt||(c.ymax-c.ymin)/5;
 for(let v=c.ymin;v<=c.ymax+1e-9;v+=yt)s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#25347a"/><text x="${ml-8}" y="${Y(v)+4}" text-anchor="end" class="sv">${fmt(v,2)}</text>`;
 for(let v=c.xmin;v<=c.xmax+1e-9;v+=xt)s+=`<line y1="${mt}" y2="${mt+ih}" x1="${X(v)}" x2="${X(v)}" stroke="#25347a"/><text x="${X(v)}" y="${mt+ih+16}" text-anchor="middle" class="sv">${fmt(v,2)}</text>`;
 s+=`<rect x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="none" stroke="#7d8fe0"/>`;
 s+=`<text x="${ml+iw/2}" y="${H-8}" text-anchor="middle" class="sv" style="font-size:13px">${esc(c.xlab||'')}</text>`;
 s+=`<text transform="translate(14 ${mt+ih/2}) rotate(-90)" text-anchor="middle" class="sv" style="font-size:13px">${esc(c.ylab||'')}</text>`;
 const cols=['#4db2ff','#ffa24a','#2ee6c5','#b196ff'];
 (c.series||[]).forEach((se,i)=>{const col=se.color||cols[i%4];
  if(se.line)s+=`<polyline fill="none" stroke="${col}" stroke-width="${se.lw||2.5}"${se.dash?' stroke-dasharray="6 5"':''} points="${se.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`;
  if(!se.nomark)se.pts.forEach(p=>{const x=X(p[0]),y=Y(p[1]),r=se.r||5;const sh=se.shape||'c';
   s+=sh==='s'?`<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" fill="${col}"/>`:sh==='t'?`<path d="M${x},${y-r-1}L${x+r+1},${y+r}L${x-r-1},${y+r}Z" fill="${col}"/>`:sh==='x'?`<path d="M${x-r},${y-r}L${x+r},${y+r}M${x-r},${y+r}L${x+r},${y-r}" stroke="${col}" stroke-width="2.4"/>`:`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/>`;});});
 if(c.series&&c.series.filter(s=>s.name).length>1){let lx=ml+10;c.series.forEach((se,i)=>{if(!se.name)return;const col=se.color||cols[i%4];s+=`<rect x="${lx}" y="${mt+6}" width="10" height="10" fill="${col}"/><text x="${lx+15}" y="${mt+15}" class="sv">${esc(se.name)}</text>`;lx+=se.name.length*7+36;});}
 (c.extra||[]).forEach(f=>{s+=f(X,Y);});
 return s+'</svg>';}};

/* ===== planets / planet drawings ===== */
function planetSVG(name,size=64){const d=PLANETS_ALL[name];if(!d)return '';const id='pg'+name+size;const r=size/2;
 let extra='';
 if(name==='Saturn')extra=`<ellipse cx="${r}" cy="${r}" rx="${r*1.0}" ry="${r*.28}" fill="none" stroke="#e9d9a8" stroke-width="${size*.07}" transform="rotate(-18 ${r} ${r})" opacity=".95"/>`;
 let bands='';if(name==='Jupiter'||name==='Saturn')bands=`<clipPath id="${id}c"><circle cx="${r}" cy="${r}" r="${r*.62}"/></clipPath><g clip-path="url(#${id}c)" opacity=".5"><rect x="0" y="${size*.28}" width="${size}" height="${size*.07}" fill="#8a5a2b"/><rect x="0" y="${size*.45}" width="${size}" height="${size*.09}" fill="#fff3d0"/><rect x="0" y="${size*.6}" width="${size}" height="${size*.06}" fill="#8a5a2b"/></g>`;
 const pad=name==='Saturn'?0:0;
 return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${name}"><defs><radialGradient id="${id}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${d.c1}"/><stop offset="1" stop-color="${d.c2}"/></radialGradient></defs><circle cx="${r}" cy="${r}" r="${r*(name==='Saturn'?.62:.92)}" fill="url(#${id})"/>${bands}${name==='Earth'?`<path d="M${r*.45},${r*.5} q${r*.2},-${r*.2} ${r*.35},0 q${-r*.05},${r*.3} ${-r*.2},${r*.35}z M${r*1.1},${r*1.0} q${r*.25},-${r*.1} ${r*.3},${r*.2} q${-r*.1},${r*.3} ${-r*.3},${r*.2}z" fill="#4cc36b" opacity=".9"/>`:''}${extra}</svg>`;}

 const bw=o.body==='ball'?0:64,bh=o.body==='ball'?0:44;
 if(o.body==='ball')s+=`<circle cx="${cx}" cy="${cy}" r="26" fill="#ffd23f" stroke="#fff4b0" stroke-width="2"/>`;
 else if(o.body==='sky')s+=`<g transform="translate(${cx} ${cy})"><circle cx="0" cy="-17" r="8" fill="#ffd8b0"/><rect x="-6" y="-9" width="12" height="26" rx="5" fill="#ff8a3d"/><path d="M-6,17L-10,32M6,17L10,32M-6,-4L-18,6M6,-4L18,6" stroke="#ffd8b0" stroke-width="4" stroke-linecap="round"/></g>`;
 else s+=`<rect x="${cx-32}" y="${cy-22}" width="64" height="44" rx="6" fill="#7aa7ff" stroke="#cfe0ff" stroke-width="2"/>`;
 if(o.floor)s+=`<line x1="${cx-120}" x2="${cx+120}" y1="${cy+22}" y2="${cy+22}" stroke="#9aa9e8" stroke-width="3"/>`;
 (o.items||[]).forEach(it=>{const L=it.len,c=it.c||'#4db2ff';let x1=cx,y1=cy,x2=cx,y2=cy,lx,ly,an='middle';
  const e=o.body==='ball'?28:o.body==='sky'?(it.d==='up'||it.d==='down'?34:20):(it.d==='up'||it.d==='down'?24:34);
  if(it.d==='up'){y1=cy-e;y2=y1-L;lx=cx;ly=y2-8;}
  if(it.d==='down'){y1=cy+e;y2=y1+L;lx=cx;ly=y2+16;}
  if(it.d==='left'){x1=cx-e;x2=x1-L;ly=cy-10;lx=x2;an='middle';}
  if(it.d==='right'){x1=cx+e;x2=x1+L;ly=cy-10;lx=x2;an='middle';}
  if(it.d==='up'||it.d==='down'){lx=cx+(it.off||0)+(it.side==='r'?10:0);x1+=it.off||0;x2+=it.off||0;an=it.side==='r'?'start':'middle';if(it.side==='r')ly=(y1+y2)/2;}
  s+=arrow(x1,y1,x2,y2,{c,w:4,label:it.text,lx,ly,anchor:an});});
 if(o.title)s+=`<text x="10" y="18" class="sv" style="font-size:13px">${esc(o.title)}</text>`;
 return s+'</svg>';};

/* ===== data: glossary, planets, modules meta ===== */
const GLOSS={
gravity:{t:'Gravity',d:'An attractive (pulling) force between any two objects that have mass. It is a non-contact force.'},
force:{t:'Force',d:'A push or a pull. Measured in newtons (N). Forces are drawn as arrows.'},
noncontact:{t:'Non-contact force',d:'A force that acts without the objects touching, such as gravity, magnetism or electrostatic force.'},
contact:{t:'Contact force',d:'A force that only acts when objects touch, such as friction, air resistance or a push.'},
newton:{t:'Newton (N)',d:'The unit of force. Named after Sir Isaac Newton. About 1 N is the weight of a small apple on Earth.'},
mass:{t:'Mass',d:'The amount of matter (stuff) in an object. Measured in kilograms (kg). It does not change when the object moves to a different place.'},
weight:{t:'Weight',d:'The force of gravity acting on an object. Measured in newtons (N). It depends on the object\'s mass and the gravitational field strength where it is.'},
field:{t:'Gravitational field',d:'The region around an object where other objects feel a force of gravity.'},
g:{t:'Gravitational field strength (g)',d:'The force of gravity on each 1 kg of mass. Measured in newtons per kilogram (N/kg). On Earth it is about 10 N/kg (more exactly 9.8 N/kg).'},
kg:{t:'Kilogram (kg)',d:'The unit of mass. 1000 g = 1 kg.'},
newtonmeter:{t:'Newton meter',d:'A spring-based instrument used to measure forces, including weight, in newtons.'},
balance:{t:'Balance',d:'An instrument used to measure mass in kg or g by comparing an object with known masses.'},
resultant:{t:'Resultant force',d:'The single force that has the same effect as all the forces acting on an object added together (taking direction into account).'},
balanced:{t:'Balanced forces',d:'Forces that are equal in size and opposite in direction. The resultant force is zero, so the motion does not change.'},
unbalanced:{t:'Unbalanced forces',d:'Forces that are not equal. There is a resultant force, so the object speeds up, slows down or changes direction.'},
drag:{t:'Air resistance (drag)',d:'The force of the air pushing against an object moving through it. It acts in the opposite direction to the motion and gets bigger as speed increases.'},
terminal:{t:'Terminal velocity',d:'The constant top speed reached by a falling object when the drag force equals its weight, so the resultant force is zero.'},
accel:{t:'Acceleration',d:'Speeding up, slowing down or changing direction. It happens when there is a resultant force.'},
orbit:{t:'Orbit',d:'The curved path of one object around another, held in place by gravity.'},
planet:{t:'Planet',d:'A large, round object that orbits a star and has cleared other objects from its path. There are eight in our Solar System.'},
dwarf:{t:'Dwarf planet',d:'A round object orbiting the Sun that has not cleared its orbit of other objects, for example Pluto, Ceres and Eris.'},
star:{t:'Star',d:'A huge ball of hot gas that gives out light. Our star is the Sun.'},
satellite:{t:'Satellite',d:'An object that orbits a larger object. The Moon is a natural satellite of Earth. Many artificial satellites orbit Earth.'},
moon:{t:'Moon',d:'A natural satellite that orbits a planet. (Written with a capital for Earth\'s Moon.)'},
terrestrial:{t:'Terrestrial planet',d:'A small, rocky planet: Mercury, Venus, Earth and Mars.'},
gasgiant:{t:'Gas giant',d:'A very large planet made mostly of hydrogen and helium: Jupiter and Saturn.'},
icegiant:{t:'Ice giant',d:'A large planet made of icy materials such as water, methane and ammonia around a rocky core: Uranus and Neptune.'},
solar:{t:'Solar System',d:'The Sun and everything that orbits it: eight planets, dwarf planets, moons, asteroids and comets.'},
freefall:{t:'Free fall',d:'Falling with gravity as the only force acting (or the only important force). Astronauts in orbit are in free fall.'},
weightless:{t:'Apparent weightlessness',d:'The feeling of having no weight when you and your surroundings are all falling together. Gravity is still acting.'},
iv:{t:'Independent variable',d:'The one thing you change in an investigation.'},
dv:{t:'Dependent variable',d:'The thing you measure to see the effect of the change.'},
cv:{t:'Control variable',d:'A thing you keep the same so the test is fair.'},
fair:{t:'Fair test',d:'An investigation where only the independent variable is changed and every control variable is kept the same.'},
reliable:{t:'Reliable',d:'Results that are repeatable. Repeat measurements and close results suggest reliability.'},
anomaly:{t:'Anomaly',d:'A result that does not fit the pattern of the others. It is often caused by a mistake or measurement error.'},
mean:{t:'Mean (average)',d:'Add up all the values and divide by how many there are.'},
prediction:{t:'Prediction',d:'A statement about what you think will happen. A good prediction includes a reason.'},
hypothesis:{t:'Hypothesis',d:'A testable explanation, usually written as "If I change ..., then ... will happen because ...".'},
crater:{t:'Crater',d:'A bowl-shaped hole made when an object hits a surface at high speed.'},
meteorite:{t:'Meteorite',d:'A piece of rock or metal from space that lands on the surface of a planet or moon.'},
tide:{t:'Tide',d:'The regular rise and fall of sea level, mainly caused by the gravitational pull of the Moon (and a smaller effect from the Sun).'},
vacuum:{t:'Vacuum',d:'A space with no air or other matter, so there is no air resistance.'},
atmosphere:{t:'Atmosphere',d:'The layer of gases around a planet.'},
area:{t:'Surface area',d:'How much space the surface of an object covers. A bigger parachute has a bigger surface area.'}

const QB={};
const Q={types:{}};
const AOTIP={1:'AO1: recall and understanding',2:'AO2: apply what you know',3:'AO3: analyse and evaluate'};
Q.render=(q,o={})=>{
 const card=el(`<section class="q" aria-label="Question"><div class="qh">${o.num?`<span class="qn">Q${o.num}</span>`:''}<span class="badge ao${q.ao}" title="${AOTIP[q.ao]}">AO${q.ao}</span><span>[${q.marks} mark${q.marks>1?'s':''}]</span>${o.tag?`<span class="tag">${o.tag}</span>`:''}</div><div class="qt">${T(q.q)}</div><div class="qfig"></div><div class="qbody"></div><div class="fb" hidden aria-live="polite"></div></section>`);
 const fg=$('.qfig',card);
 if(q.fig){fg.innerHTML=typeof q.fig==='string'?D[q.fig]():q.fig.chart?Chart.svg(q.fig.chart):q.fig();fg.classList.add('fig');}else fg.remove();
 const c={card,q,o,body:$('.qbody',card),fb:$('.fb',card),finished:false};
 c.fin=(frac,extra)=>{if(c.finished)return;c.finished=true;frac=clamp(frac,0,1);if(!o.noRec)P.rec(q,frac);if(o.onDone)o.onDone({frac,got:Math.round(frac*q.marks*2)/2,of:q.marks,q});};
 c.say=(good,html)=>{c.fb.hidden=false;c.fb.className='fb '+(good?'good':'bad');c.fb.innerHTML=html;};
 Q.types[q.t](c);
 return card;};

/* prediction card (not marked) */
Q.prediction=(p,onDone)=>{const name=nid('pr');
 const card=el(`<div class="call predict"><b>Predict first</b><div class="qt">${T(p.q)}</div><fieldset class="opts"><legend class="sr">Choose your prediction</legend>${p.opts.map((t,i)=>`<label class="opt"><input type="radio" name="${name}" value="${i}"><span>${T(t)}</span></label>`).join('')}</fieldset><div class="actions"><button type="button" class="btn primary">Lock in my prediction</button></div><div class="pfb" aria-live="polite"></div></div>`);
 $('button',card).onclick=()=>{const s=$('input:checked',card);if(!s){$('.pfb',card).innerHTML='<p>Pick the answer you think is most likely – there is no penalty for a wrong prediction.</p>';return;}
  $$('input',card).forEach(i=>i.disabled=true);$('button',card).disabled=true;
  $('.pfb',card).innerHTML=`<p><b>Prediction locked in:</b> ${T(p.opts[+s.value])}.</p>${p.why?`<details><summary>Check your idea after you have tested it</summary><p>${T(p.why)}</p></details>`:''}`;
  onDone&&onDone(+s.value===p.a);};
 return card;};

/* ---- multiple choice ---- */
Q.types.mcq=c=>{const {q,o}=c,name=nid('mq'),order=q.keep?q.opts.map((_,i)=>i):shuffle(q.opts.map((_,i)=>i));
 c.body.innerHTML=`<fieldset class="opts"><legend class="sr">Choose one answer</legend>${order.map(i=>`<label class="opt" data-i="${i}"><input type="radio" name="${name}" value="${i}"><span>${T(q.opts[i])}</span></label>`).join('')}</fieldset><div class="actions"><button type="button" class="btn primary chk">Check answer</button></div>`;
 let tries=0;const lock=()=>{$$('input',c.body).forEach(i=>i.disabled=true);$('.chk',c.body).disabled=true;};
 $('.chk',c.body).onclick=()=>{const sel=$('input:checked',c.body);if(!sel){c.say(false,'<b class="t">Choose an answer first.</b>');return;}
  const i=+sel.value,lab=sel.closest('.opt');
  if(i===q.a){lab.classList.add('right');lock();c.say(true,`<b class="t">${tries?'Correct this time – good rethinking.':'Correct!'}</b>${T(q.why||'')}`);c.fin(tries?.5:1);return;}
  tries++;lab.classList.add('wrong');sel.disabled=true;sel.checked=false;
  if(o.single||tries>=2){lock();const right=$(`.opt[data-i="${q.a}"]`,c.body);right.classList.add('right');c.say(false,`<b class="t">Not quite.</b>The correct answer is highlighted. ${T(q.why||'')}`);c.fin(0);}
  else c.say(false,`<b class="t">Not quite – have another go.</b>Hint: ${T(q.hint||'Look at the other options again. Which ideas do you know for certain?')}`);};};

/* ---- true / false ---- */
Q.types.tf=c=>{const {q}=c;
 c.body.innerHTML=`<div class="actions"><button type="button" class="btn" data-v="1">True</button><button type="button" class="btn" data-v="0">False</button></div>`;
 $$('button',c.body).forEach(b=>b.onclick=()=>{const v=b.dataset.v==='1',ok=v===q.a;$$('button',c.body).forEach(x=>x.disabled=true);
  c.say(ok,`<b class="t">${ok?'Correct – it is '+(q.a?'true':'false')+'.':'Not quite – it is '+(q.a?'true':'false')+'.'}</b>${T(q.why||'')}`);c.fin(ok?1:0);});};

/* ---- predict then explain ---- */
Q.types.predict=c=>{const {q}=c,n1=nid('p1'),n2=nid('p2');let p1=null;
 c.body.innerHTML=`<fieldset class="opts" id="${n1}"><legend><b>Step 1 – Predict</b></legend>${q.p1.opts.map((t,i)=>`<label class="opt"><input type="radio" name="${n1}" value="${i}"><span>${T(t)}</span></label>`).join('')}</fieldset><div class="actions s1"><button type="button" class="btn primary">Lock in prediction</button></div><div class="s2"></div>`;
 $('.s1 button',c.body).onclick=()=>{const s=$(`input[name="${n1}"]:checked`,c.body);if(!s){c.say(false,'<b class="t">Make a prediction first.</b>');return;}
  p1=+s.value;c.fb.hidden=true;$$(`input[name="${n1}"]`,c.body).forEach(i=>i.disabled=true);$('.s1 button',c.body).remove();
  const s2=$('.s2',c.body);s2.innerHTML=`<fieldset class="opts"><legend><b>Step 2 – Explain:</b> ${T(q.p2.q)}</legend>${shuffle(q.p2.opts.map((t,i)=>[t,i])).map(([t,i])=>`<label class="opt"><input type="radio" name="${n2}" value="${i}"><span>${T(t)}</span></label>`).join('')}</fieldset><div class="actions"><button type="button" class="btn primary">Check both answers</button></div>`;
  $('button',s2).onclick=()=>{const t=$(`input[name="${n2}"]:checked`,s2);if(!t){c.say(false,'<b class="t">Choose the best explanation.</b>');return;}
   const a=p1===q.p1.a,b=+t.value===q.p2.a;$$('input',s2).forEach(i=>i.disabled=true);$('button',s2).remove();
   c.say(a&&b,`<b class="t">Prediction: ${a?'✓ correct':'✗ not quite'} · Explanation: ${b?'✓ correct':'✗ not quite'}</b>Correct prediction: <b>${T(q.p1.opts[q.p1.a])}</b>.<br>Best explanation: <b>${T(q.p2.opts[q.p2.a])}</b><br>${T(q.why||'')}`);c.fin((a+b)/2);};};};

/* ---- calculation ---- */
Q.types.calc=c=>{const {q,o}=c,units=q.units||['N','kg','N/kg','g'],wm=q.working?Math.max(1,q.marks-2):0;let tries=0;
 c.body.innerHTML=`${q.working?`<label class="sr" for="w${q.id}">Working</label><textarea id="w${q.id}" placeholder="Write the equation, substitute the numbers, then calculate…" style="min-height:70px"></textarea>`:''}<div class="row" style="margin-top:8px"><label>Answer <input type="number" step="any" inputmode="decimal" class="an" aria-label="numerical answer"></label><label>Unit <select class="un" aria-label="unit"><option value="">choose…</option>${units.map(u=>`<option>${u}</option>`).join('')}</select></label><button type="button" class="btn primary chk">Check</button></div><div class="hints"></div>`;
 const check=$('.chk',c.body);
 const solution=()=>`<b class="t">Worked solution</b>${q.sol}<br>Answer: <b>${fmt(q.ans,4)} ${q.unit}</b>`;
 const selfmark=(auto)=>{ // working self-assessment
  const box=el(`<div class="reveal"><b>Check your working</b><div>${q.sol}</div>${Array.from({length:wm},(_,i)=>`<label class="opt"><input type="checkbox"><span>${i===0?'I wrote the correct equation':'I substituted the numbers correctly'}</span></label>`).join('')}<div class="actions"><button type="button" class="btn teal">Award my marks</button></div></div>`);
  c.body.append(box);$('button',box).onclick=()=>{const k=$$('input:checked',box).length;$('button',box).disabled=true;$$('input',box).forEach(i=>i.disabled=true);c.say(true,`<b class="t">${auto?'Correct!':'Marked.'} Marks: ${(q.marks>1?2:1)*(auto?1:0)+k} / ${q.marks}</b>`);c.fin(((q.marks>1?2:1)*(auto?1:0)+k)/q.marks);};};
 const done=(good,frac,html)=>{check.disabled=true;$('.an',c.body).disabled=true;$('.un',c.body).disabled=true;if(q.working&&good&&frac===1&&wm){c.say(true,`<b class="t">Answer and unit correct!</b>`);selfmark(true);}else{c.say(good,html);c.fin(frac);}};
 check.onclick=()=>{const raw=$('.an',c.body).value.trim().replace(',','.'),v=parseFloat(raw),u=$('.un',c.body).value;
  if(raw===''||isNaN(v)||!u){c.say(false,'<b class="t">Enter a number and choose a unit.</b>');return;}
  const numOK=Math.abs(v-q.ans)<=Math.abs(q.ans)*(q.tol||0.005)+1e-9,unitOK=u===q.unit;
  if(numOK&&unitOK){done(true,tries?.5:1,`<b class="t">Correct${tries?' this time':''}!</b>${q.sol||''}`);return;}
  tries++;
  if(o.single){const auto=q.marks===1?0:(numOK?1:0)+(unitOK?1:0);done(false,auto/q.marks,`<b class="t">${numOK?'Number right, unit wrong':'Not quite'}.</b>${solution()}`);return;}
  const hs=q.hints||['Write the equation first: W = m × g.','Substitute the numbers into the equation. Check your units: mass in kg, g in N/kg.','Multiply (or divide) carefully. Re-check each number you used.'];
  const hint=numOK&&!unitOK?'Your number is right – check the unit. Weight is a force. Mass is in kg. g is in N/kg.':!numOK&&unitOK?hs[Math.min(tries-1,hs.length-1)]:hs[Math.min(tries-1,hs.length-1)];
  c.say(false,`<b class="t">Not quite – hint ${Math.min(tries,3)} of 3</b>${T(hint)}`);
  if(tries>=3&&!$('.show',c.body)){const b=el('<button type="button" class="btn warn show">Show me the worked solution</button>');$('.row',c.body).append(b);b.onclick=()=>{b.remove();done(false,0,solution());};}};};

/* ---- written answers (self-marked) ---- */
Q.types.short=c=>{const {q}=c;const key='d_'+(q.id||'');
 c.body.innerHTML=`<label class="sr" for="t${q.id}">Your answer</label><textarea id="t${q.id}" placeholder="Write your answer here. Use scientific words."></textarea>${q.starters?`<div class="chips">${q.starters.map(s=>`<button type="button" class="chip st">${esc(s)}</button>`).join('')}</div>`:''}<div class="actions"><button type="button" class="btn primary cmp">Compare with model answer</button></div><div class="cmpbox"></div>`;
 const ta=$('textarea',c.body);ta.value=S.draft[q.id]||'';ta.oninput=()=>{S.draft[q.id]=ta.value;save();};
 $$('.st',c.body).forEach(b=>b.onclick=()=>{ta.value+=(ta.value&&!/\s$/.test(ta.value)?' ':'')+b.textContent+' ';ta.focus();ta.oninput();});
 $('.cmp',c.body).onclick=()=>{if(ta.value.trim().length<4){c.say(false,'<b class="t">Write an answer first</b>Have a go – even a partial answer helps you learn. Use the sentence starters if you are stuck.');return;}
  c.fb.hidden=true;ta.readOnly=true;$('.cmp',c.body).remove();
  const box=$('.cmpbox',c.body);box.innerHTML=`<div class="reveal"><b>Model answer</b><p>${T(q.model)}</p><b>Mark scheme – tick each point you made (the computer cannot mark written answers fairly, so you mark it)</b>${q.points.map(p=>`<label class="opt"><input type="checkbox"><span>${T(p)}</span></label>`).join('')}${q.kw?`<p class="sim-note"><b>Key words to include:</b> ${q.kw.join(', ')}</p>`:''}<div class="actions"><button type="button" class="btn teal">Award my marks</button></div></div>`;
  $('button',box).onclick=()=>{const k=Math.min($$('input:checked',box).length,q.marks);$('button',box).disabled=true;$$('input',box).forEach(i=>i.disabled=true);
   c.say(k===q.marks,`<b class="t">You awarded yourself ${k} / ${q.marks}</b>${k<q.marks?T(q.improve||'To gain more marks, add the missing points from the model answer and use the key words.'):'Excellent – a full-mark answer.'}`);c.fin(k/q.marks);};};};
Q.types.extended=Q.types.short;

/* ---- matching / labelling ---- */
Q.types.match=c=>{const {q,o}=c,pairs=q.pairs,rights=shuffle(q.opts||pairs.map(p=>p[1])),lab=q.t==='label';let tries=0;
 c.body.innerHTML=`<div>${pairs.map((p,i)=>`<div class="matchrow" data-i="${i}"><span>${lab?'<b>Label '+esc(p[0])+'</b>':T(p[0])}</span><select aria-label="${lab?'Label '+esc(p[0]):esc(p[0])}"><option value="">choose…</option>${rights.map(r=>`<option>${esc(r)}</option>`).join('')}</select><span class="mk" aria-hidden="true"></span></div>`).join('')}</div><div class="actions"><button type="button" class="btn primary chk">Check</button></div>`;
 $('.chk',c.body).onclick=()=>{const rows=$$('.matchrow',c.body);if(rows.some(r=>!$('select',r).value)){c.say(false,'<b class="t">Complete every row first.</b>');return;}
  let ok=0;rows.forEach(r=>{const s=$('select',r),good=s.value===pairs[+r.dataset.i][1];if(good)ok++;$('.mk',r).textContent=good?'✓':'✗';if(good)s.disabled=true;});
  tries++;if(ok===pairs.length){$$('select',c.body).forEach(s=>s.disabled=true);$('.chk',c.body).disabled=true;c.say(true,`<b class="t">${tries>1?'All correct this time!':'All correct!'}</b>${T(q.why||'')}`);c.fin(tries>1?.5:1);}
  else if(o.single||tries>=2){$$('.matchrow',c.body).forEach(r=>{const s=$('select',r);s.disabled=true;if(s.value!==pairs[+r.dataset.i][1])$('.mk',r).textContent='✗ → '+pairs[+r.dataset.i][1];});$('.chk',c.body).disabled=true;c.say(false,`<b class="t">${ok} of ${pairs.length} correct.</b>The right answers are shown against each wrong row. ${T(q.why||'')}`);c.fin(ok/pairs.length*(o.single?1:.5));}
  else c.say(false,`<b class="t">${ok} of ${pairs.length} correct.</b>The ✓ rows are locked. Try the rest again.`);};};
Q.types.label=Q.types.match;

/* ---- ordering ---- */
Q.types.order=c=>{const {q,o}=c;let seq=[],tries=0;const pool=shuffle(q.items.map((t,i)=>i));
 const draw=()=>{c.body.innerHTML=`<p class="sim-note">Click the items in the right order.</p><div class="chips">${pool.filter(i=>!seq.includes(i)).map(i=>`<button type="button" class="chip it" data-i="${i}">${esc(q.items[i])}</button>`).join('')}</div><p><b>Your order:</b> ${seq.length?seq.map((i,n)=>`${n+1}. ${esc(q.items[i])}`).join(' &nbsp;→&nbsp; '):'<i>nothing yet</i>'}</p><div class="actions"><button type="button" class="btn ghost rst">Start again</button><button type="button" class="btn primary chk"${seq.length<q.items.length?' disabled':''}>Check order</button></div>`;
  $$('.it',c.body).forEach(b=>b.onclick=()=>{seq.push(+b.dataset.i);draw();});$('.rst',c.body).onclick=()=>{seq=[];draw();};
  $('.chk',c.body).onclick=()=>{tries++;const ok=seq.filter((v,n)=>v===n).length;
   if(ok===q.items.length){c.body.innerHTML=`<p><b>${q.items.map(esc).join(' → ')}</b></p>`;c.say(true,`<b class="t">Correct!</b>${T(q.why||'')}`);c.fin(tries>1?.5:1);}
   else if(o.single||tries>=2){c.body.innerHTML=`<p><b>Correct order:</b> ${q.items.map(esc).join(' → ')}</p>`;c.say(false,`<b class="t">${ok} of ${q.items.length} in the right place.</b>${T(q.why||'')}`);c.fin(ok/q.items.length*.5);}
   else{c.say(false,`<b class="t">${ok} of ${q.items.length} in the right place.</b>Start again and rethink.`);seq=[];draw();}};};
 draw();};

const Sims={};
const sl=(id,label,min,max,step,val,unit='')=>`<div><label for="${id}">${label}: <output id="${id}-o">${val}${unit}</output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;

/* ---------- 1. Gravity laboratory ---------- */
Sims.gravityLab=(host,ctx)=>{const u=nid('gl');let m1=2,m2=2,d=4;
 host.innerHTML=`<h3>Interactive Gravity Laboratory</h3><p class="sim-note">Objects A and B are in empty space. Arrow length is drawn to scale with the force. "Mass units" and "distance units" are simple scales, not kg or metres.</p><div class="fig" id="${u}f"></div>
 <div class="ctl">${sl(u+'a','Mass of A',1,4,1,2,' units')}${sl(u+'b','Mass of B',1,4,1,2,' units')}${sl(u+'d','Distance apart',2,8,1,4,' units')}</div>
 <div class="read"><div><small>Force of A on B (and B on A)</small><strong id="${u}r"></strong></div><div><small>Compared with the start</small><strong id="${u}x"></strong></div></div>
 <div class="call tip" id="${u}i" aria-live="polite"></div>
 <div class="call remember"><b>Notice</b>The two arrows are always the <b>same length</b>. A pulls B with exactly the same size of force that B pulls A, in the opposite direction.</div>`;
 const f=(x,b)=>x===b?'unchanged':x>b?`×${fmt(x/b)}`:`÷${fmt(b/x)}`;
 const rel=()=>(m1*m2*16)/(d*d*4);
 function upd(){const r=rel();$('#'+u+'f',host).innerHTML=D.pair(m1,m2,d,{len:Math.max(3,12*r)});
  $('#'+u+'a-o').textContent=m1+' units';$('#'+u+'b-o').textContent=m2+' units';$('#'+u+'d-o').textContent=d+' units';
  $('#'+u+'r').textContent='×'+fmt(r,3)+' of start';
  $('#'+u+'x').textContent=r===1?'same force':r>1?`${fmt(r,2)}× stronger`:`${fmt(1/r,2)}× weaker`;
  $('#'+u+'i').innerHTML=`<b>What changed since the start?</b>Mass A ${f(m1,2)} · Mass B ${f(m2,2)} · Distance ${f(d,4)} → Force ${r===1?'unchanged':'×'+fmt(r,3)}.${r<=0.0625?' <br>This is the weakest this lab can make – but notice the arrows are tiny, <b>not zero</b>.':''}`;
  const ch=(m1!==2)+(m2!==2)+(d!==4);
  if(ch===1&&Math.abs(r-2)<1e-9)ctx.done('t1');
  if(ch===1&&d===8&&Math.abs(r-.25)<1e-9)ctx.done('t2');

const Sky=(()=>{const m=80,g=10,k1=0.264,k2=32,TO=20,TR=5,dt=0.01,N=3300;const V=[],Dr=[];let v=0;

 const STG=[[0,2],[2,12],[12,20],[20,30]];

  const series=[{line:true,nomark:true,pts,lw:3}];if(mk!=null)series.push({pts:[[mk,V[Math.round(mk/dt)]]],r:7,color:'#ffd23f'});
  return {xmin:0,xmax:32,ymin:0,ymax:60,xt:4,yt:10,w:460,h:300,xlab:'Time (s)',ylab:'Speed (m/s)',title:'Speed–time graph for a skydiver',series,extra:[(X,Y)=>`<line x1="${X(TO)}" x2="${X(TO)}" y1="${Y(0)}" y2="${Y(60)}" stroke="#ffa24a" stroke-dasharray="5 4"/><text x="${X(TO)+4}" y="${Y(56)}" class="sv">parachute opens</text>`,...(full?[]:STG.slice(1).map(s=>(X,Y)=>`<line x1="${X(s[0])}" x2="${X(s[0])}" y1="${Y(0)}" y2="${Y(60)}" stroke="#34458f" stroke-dasharray="2 4"/>`))]};}};})();

 /* 2 collect */()=>{const L=lvls();let cur=L[0];box.innerHTML=`<h4>Step 3 – Collect data</h4><p>Choose a value of <b>${F().name.toLowerCase()}</b>, then press <b>Drop</b> to take a measurement. Take <b>at least 3 repeats</b> for every value (maximum 5).</p><div class="chips" id="${u}lv" role="group" aria-label="Choose a value"></div><div class="actions"><button type="button" class="btn teal" id="${u}d1">Drop once</button><button type="button" class="btn" id="${u}d3">Drop 3 times</button><button type="button" class="btn ghost" id="${u}cl">Clear all data</button></div><div class="tbl"><table><thead><tr><th>${F().name} (${F().unit})</th><th class="num">Repeat 1</th><th class="num">Repeat 2</th><th class="num">Repeat 3</th><th class="num">Repeat 4</th><th class="num">Repeat 5</th></tr></thead><tbody id="${u}tb"></tbody></table></div><p class="sim-note">${C.dvName} (${C.dvUnit}) – <span class="simtag">simulated</span></p><div class="fb" hidden id="${u}cf2"></div>`;

 /* 3 averages */()=>{const L=lvls();box.innerHTML=`<h4>Step 4 – Calculate the mean</h4><p>Add up the repeats and divide by how many there are. Give each mean to ${C.dec} decimal places. <span class="simtag">simulated</span></p><div id="${u}ar"></div><div class="actions"><button type="button" class="btn primary" id="${u}ac">Check my means</button></div><div class="fb" hidden id="${u}af" aria-live="polite"></div>`;

 /* 4 graph */()=>{const L=lvls(),f=F();box.innerHTML=`<h4>Step 5 – Plot a graph</h4><p>The independent variable goes on the <b>x-axis</b> (horizontal) and the dependent variable on the <b>y-axis</b> (vertical).</p><div class="row"><label>x-axis <select id="${u}x"><option value="">choose…</option><option value="iv">${f.name} (${f.unit})</option><option value="dv">${C.dvName} (${C.dvUnit})</option></select></label><label>y-axis <select id="${u}y"><option value="">choose…</option><option value="iv">${f.name} (${f.unit})</option><option value="dv">${C.dvName} (${C.dvUnit})</option></select></label><button type="button" class="btn primary" id="${u}pl">Plot graph</button></div><div class="fb" hidden id="${u}gf" aria-live="polite"></div><div id="${u}gx"></div>`;

   const m0=st.means[L[0]],m1=st.means[L[L.length-1]],tot=m1-m0,thr=C.dec>1?0.15:0.1;const dir=Math.abs(tot)<thr?'none':tot>0?'up':'down';
   let shape='line';if(L.length>=3){const sl=[];for(let i=1;i<L.length;i++)sl.push((st.means[L[i]]-st.means[L[i-1]])/(L[i]-L[i-1]));const ratio=sl[sl.length-1]/(sl[0]||1e-9);shape=(ratio>0.65&&ratio<1.5)?'line':'curve';}
   $('#'+u+'gc',box).onclick=()=>{const d=$('#'+u+'gd',box).value,s=$('#'+u+'gs',box).value,g=$('#'+u+'gcf',box);g.hidden=false;if(!d||(d!=='none'&&!s)){g.className='fb bad';g.textContent='Complete both choices.';return;}

 /* 5 conclusion */()=>{const f=F(),gr=st.gr||{dir:'up'};box.innerHTML=`<h4>Step 6 – Write a conclusion</h4><p>Complete the conclusion using your results and your science knowledge.</p><div class="call remember">I found that as the ${f.name.toLowerCase()} increases, the ${C.dvName.toLowerCase()} <select id="${u}c1"><option value="">choose…</option><option value="up">increases</option><option value="down">decreases</option><option value="none">does not change in a clear way</option></select>. This happens because <select id="${u}c2" style="max-width:100%"><option value="">choose a reason…</option>${shuffle(C.reasons[st.iv].map((t,i)=>[t,i])).map(([t,i])=>`<option value="${i}">${t}</option>`).join('')}</select>.</div><div class="actions"><button type="button" class="btn primary" id="${u}cc">Check conclusion</button></div><div class="fb" hidden id="${u}cf" aria-live="polite"></div>`;

   if(okA&&okB){unlock();nav();}};},
 /* 6 evaluate */()=>{const L=lvls();const an=[];L.forEach(l=>{const a=st.trials[l],md=median(a);a.forEach((v,i)=>{if(Math.abs(v-md)>C.anomT)an.push(`${F().lab(l)}, repeat ${i+1}: ${fmt(v,C.dec)} ${C.dvUnit} (median ${fmt(md,C.dec)})`);});});

  const rel=spread<=(C.dec>1?0.35:0.2);

   if(ok){fb.className='fb good';fb.innerHTML='<b class="t">✓ All correct.</b>Good improvements: repeat and average, control variables, and measure more accurately.';unlock();nav();}else{fb.className='fb bad';fb.innerHTML='<b class="t">Not quite.</b>Good improvements make the test fairer or the measurements more reliable. Re-read each option.';}};},
