function mythCard(m,after){
 const card=el(`<section class="card" aria-label="Myth"><h3>${m.emoji} Myth: “${m.myth}”</h3><div class="mb"></div></section>`);
 const b=$('.mb',card);let pOK=false,eOK=false;
 const done=S.myth[m.id]&&S.myth[m.id].done;
 const summary=()=>{const r=S.myth[m.id];b.innerHTML=`<p><span class="badge ao1">Myth busted ✓</span> Your thinking: <b>${r.c==='changed'?'I changed my mind':r.c==='right'?'I already knew':'Still not sure – revisit it'}</b></p><div class="call remember"><b>The science</b>${T(m.truth)}</div>${r.txt?`<p><b>Your correction:</b> ${esc(r.txt)}</p>`:''}<div class="actions"><a class="btn small" href="#/m/${m.mod}/learn">Review Module ${m.mod.slice(1)}</a><button type="button" class="btn small ghost again">Try again</button></div>`;$('.again',b).onclick=()=>{delete S.myth[m.id];save();step1();};};
 const step1=()=>{b.innerHTML=`<p><b>Step 1 – Predict.</b> Is this statement true or false?</p><fieldset class="opts"><legend class="sr">True or false</legend><label class="opt"><input type="radio" name="${m.id}p" value="t"><span>True</span></label><label class="opt"><input type="radio" name="${m.id}p" value="f"><span>False</span></label></fieldset><div class="actions"><button type="button" class="btn primary">Lock in my prediction</button></div><p class="fbx" aria-live="polite"></p>`;
  $('button',b).onclick=()=>{const s=$('input:checked',b);if(!s){$('.fbx',b).textContent='Choose true or false first – a guess is fine.';return;}pOK=s.value==='f';step2(s.value);};};
 const step2=pv=>{const order=shuffle(m.reasons.map((t,i)=>[t,i]));
  b.innerHTML=`<p>You predicted: <b>${pv==='t'?'True':'False'}</b>.</p><p><b>Step 2 – Explain.</b> Which explanation do you think is best?</p><fieldset class="opts"><legend class="sr">Choose the best explanation</legend>${order.map(([t,i])=>`<label class="opt"><input type="radio" name="${m.id}e" value="${i}"><span>${T(t)}</span></label>`).join('')}</fieldset><div class="actions"><button type="button" class="btn primary">Check the science</button></div><p class="fbx" aria-live="polite"></p>`;
  $('button',b).onclick=()=>{const s=$('input:checked',b);if(!s){$('.fbx',b).textContent='Choose the explanation that sounds most scientific.';return;}eOK=+s.value===0;step3(pv);};};
 const step3=pv=>{b.innerHTML=`<p><b>Step 3 – Reconsider.</b></p><div class="fb ${pOK&&eOK?'good':'bad'}"><b class="t">The statement is a MYTH (it is false).</b>Prediction: ${pOK?'✓ you spotted it':'✗ you thought it was true'} · Explanation: ${eOK?'✓ best choice':'✗ not the best choice'}<br>Best explanation: <b>${T(m.reasons[0])}</b></div><div class="call remember"><b>The science</b>${T(m.truth)}</div><p class="sim-note">${T(m.test)}</p><label for="${m.id}t"><b>Rewrite the myth as a correct statement</b> (optional)</label><textarea id="${m.id}t" placeholder="Actually…"></textarea><p><b>How has your thinking changed?</b></p><div class="actions"><button type="button" class="btn" data-c="changed">I changed my mind</button><button type="button" class="btn" data-c="right">I already knew this</button><button type="button" class="btn" data-c="unsure">I\'m still not sure</button></div>`;
  $$('[data-c]',b).forEach(x=>x.onclick=()=>{S.myth[m.id]={done:1,p:pOK?1:0,e:eOK?1:0,c:x.dataset.c,txt:$('textarea',b).value.trim()};save();renderNav();summary();after&&after();});};
 done?summary():step1();return card;}

function runSession(host,cfg){
 let qs,i,res;
 const start=()=>{qs=cfg.build();i=0;res=[];step();};
 const step=()=>{if(i>=qs.length)return finish();const q=qs[i];
  host.innerHTML=`<div class="card flat"><div class="row"><b>${esc(cfg.title)}</b><span class="grow"></span><span>Question ${i+1} of ${qs.length}</span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${qs.length}" aria-valuenow="${i}"><i style="width:${pct(i,qs.length)}%"></i></div></div><div id="qs"></div><div id="nx"></div>`;
  $('#qs',host).append(Q.render(q,{num:i+1,single:cfg.single,tag:cfg.tag?cfg.tag(q):undefined,onDone:r=>{res.push(r);if(cfg.each)cfg.each(r);const nx=$('#nx',host);nx.innerHTML=`<div class="actions"><button type="button" class="btn primary">${i+1<qs.length?'Next question →':'See my results'}</button></div>`;const bt=$('button',nx);bt.onclick=()=>{i++;step();window.scrollTo({top:0});};bt.focus({preventScroll:false});}}));};
 const finish=()=>{const got=res.reduce((a,r)=>a+r.frac*r.q.marks,0),of=res.reduce((a,r)=>a+r.q.marks,0),p=pct(got,of);
  const ao={1:{g:0,o:0},2:{g:0,o:0},3:{g:0,o:0}},cat={};res.forEach(r=>{const a=ao[r.q.ao];a.g+=r.frac*r.q.marks;a.o+=r.q.marks;const c=cat[r.q.cat]=cat[r.q.cat]||{g:0,o:0};c.g+=r.frac*r.q.marks;c.o+=r.q.marks;});
  const missed=res.filter(r=>r.frac<1);
  const msg=p>=85?'Excellent – you are working at a secure level.':p>=65?'Good work – you have a solid understanding with a few gaps to close.':p>=45?'You are getting there. Use the review list below to target the gaps.':'This topic needs more work – that is OK. Go back to the Learn pages and try again.';
  const tips=[];
  [1,2,3].forEach(k=>{if(ao[k].o>=2&&ao[k].g/ao[k].o<.6)tips.push(k===1?'<b>AO1 (recall):</b> revise the key facts and definitions in the glossary.':k===2?'<b>AO2 (apply):</b> practise calculations and applying ideas to new situations.':'<b>AO3 (analyse/evaluate):</b> practise explaining <i>why</i> using "because", and interpreting graphs and data.');});
  Object.keys(cat).forEach(c=>{if(cat[c].o>=2&&cat[c].g/cat[c].o<.6)tips.push(`Revisit <a href="#/m/${CAT_MOD[c]}/learn">${CATS[c]}</a>.`);});
  host.innerHTML=`<div class="card"><h2>${esc(cfg.title)} – results</h2><div class="grid g3"><div class="stat"><b>${fmt(got,1)} / ${of}</b>marks</div><div class="stat"><b>${p}%</b>score</div><div class="stat"><b>${res.length - missed.length} / ${res.length}</b>fully correct</div></div><p><b>${msg}</b></p>
  <h3>By assessment objective</h3>${[1,2,3].filter(k=>ao[k].o).map(k=>`<div class="hbar${ao[k].g/ao[k].o<.6?' low':''}"><span>AO${k} ${k===1?'recall':k===2?'apply':'analyse'}</span><div class="tr"><i style="width:${pct(ao[k].g,ao[k].o)}%"></i></div><span>${fmt(ao[k].g,1)}/${ao[k].o}</span></div>`).join('')}
  <h3>By topic</h3>${Object.keys(cat).map(c=>`<div class="hbar${cat[c].g/cat[c].o<.6?' low':''}"><span>${CATS[c]||c}</span><div class="tr"><i style="width:${pct(cat[c].g,cat[c].o)}%"></i></div><span>${fmt(cat[c].g,1)}/${cat[c].o}</span></div>`).join('')}
  ${tips.length?`<div class="call tip"><b>How to improve</b><ul>${tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>`:'<div class="call remember"><b>Well done</b>No weak areas in this set. Try a different set or the Calculation Challenge.</div>'}
  ${missed.length?`<h3>Questions to review (${missed.length})</h3><ul>${missed.map(r=>`<li>${esc(short(r.q.q,110))} <small>[${fmt(r.frac*r.q.marks,1)}/${r.q.marks}]</small> <a href="#/m/${r.q.mod||'m1'}/learn">review</a></li>`).join('')}</ul>`:''}
  <div class="actions"><button type="button" class="btn primary again">Try again</button><a class="btn" href="${cfg.back||'#/exam'}">${cfg.backLabel||'Back to Exam Practice'}</a></div></div>`;
  $('.again',host).onclick=start;if(cfg.onFinish)cfg.onFinish({got,of,p,ao,res});window.scrollTo({top:0});};
 start();}

/* ---------- calculation challenge ---------- */
function solText(p){
 if(p.type==='W')return (p.gr?`Convert to kg: ${fmt(p.m*1000,0)} ÷ 1000 = ${fmt(p.m)} kg<br>`:'')+`W = m × g<br>W = ${fmt(p.m)} × ${p.g}<br>W = ${fmt(p.W)} N`;
 if(p.type==='m')return `m = W ÷ g<br>m = ${fmt(p.W)} ÷ ${p.g}<br>m = ${fmt(p.m)} kg`;
 return `g = W ÷ m<br>g = ${fmt(p.W)} ÷ ${fmt(p.m)}<br>g = ${fmt(p.g)} N/kg`;}
function calcQ(p){
 const hints=p.type==='W'?[p.gr?'The mass is in grams. Divide by 1000 to get kilograms, then use W = m × g.':'Write the equation first: W = m × g.','Substitute the numbers: mass in kg, and g in N/kg from the question.','Multiply them together. The unit of weight is the newton (N).']
 :p.type==='m'?['You know the weight and g. Rearrange W = m × g so that m is on its own.','m = W ÷ g. Substitute the weight and g.','Divide carefully. The unit of mass is kg.']
 :['You know the weight and the mass. Rearrange W = m × g so that g is on its own.','g = W ÷ m. Substitute the weight and the mass.','Divide carefully. The unit of g is N/kg.'];
 return {id:null,mod:'m4',cat:'calc',ao:2,t:'calc',marks:2,q:p.text,ans:p.ans,unit:p.unit,sol:solText(p),hints,units:['N','kg','N/kg','g'],lv:p.lv,p};}

 h.innerHTML=`<div class="card"><span class="simtag">Explore</span><h2>Explore</h2><p>${T(E.intro)}</p>${gated?'<div id="preds"></div><div class="lockmsg" id="lock" role="status">🔒 Lock in all your predictions above to unlock the simulation.</div>':''}${names.length>1?`<div class="tabs" role="tablist">${names.map((n,k)=>`<button role="tab" type="button" aria-selected="${k===0}" data-k="${k}">${k===0?'Parachute investigation':'Crater investigation'}</button>`).join('')}</div>`:''}<div id="sims">${names.map((n,k)=>`<div class="sim" id="sim${k}"${k?' hidden':''}></div>`).join('')}</div></div>
 <div class="card flat" aria-label="Tasks"><h3>Your tasks <small id="tcount"></small></h3><div id="tasks">${tasks.map(([id,t])=>`<div class="task" data-id="${id}"><i class="bx" aria-hidden="true"></i><span>${T(t)}<span class="sr tdone"></span></span></div>`).join('')}</div><div id="dn" class="actions"></div><div class="sr" id="live" aria-live="polite"></div></div>`;
 const upd=()=>{$('#tcount',h).textContent=`(${done.size} of ${tasks.length} done)`;const need=Math.ceil(tasks.length/2);
  const ok=done.size>=tasks.length||P.stage(m.id,'explore');
  $('#dn',h).innerHTML=ok?`<p style="flex-basis:100%"><b>${done.size>=tasks.length?'🎉 All tasks complete!':'Explore stage complete.'}</b></p>${contBtn('#/m/'+m.id+'/explain','Continue to Explain')}`:(done.size>=need?`<button type="button" class="btn ghost" id="fin">I have explored enough – continue</button>`:'');
  const f=$('#fin',h);if(f)f.onclick=()=>{P.setStage(m.id,'explore');upd();};
  if(done.size>=tasks.length)P.setStage(m.id,'explore');};
 const tick=(id)=>{if(done.has(id)||!tasks.some(t=>t[0]===id))return;done.add(id);const t=$(`.task[data-id="${id}"]`,h);t.classList.add('on');$('.bx',t).textContent='✓';$('.tdone',t).textContent=' (completed)';$('#live',h).textContent='Task completed';upd();};
 names.forEach((n,k)=>{const host=$('#sim'+k,h);const ctx={done:id=>tick(names.length>1?'t'+(k+1):id)};
  if(!Sims[n]){host.textContent='Simulation unavailable.';return;}
  try{Sims[n](host,ctx);}catch(e){console.error(e);host.innerHTML='<p>Sorry, this simulation could not start.</p>';}});
 if(names.length>1)$$('.tabs [role=tab]',h).forEach(b=>b.onclick=()=>{$$('.tabs [role=tab]',h).forEach(x=>x.setAttribute('aria-selected',x===b));names.forEach((_,k)=>{$('#sim'+k,h).hidden=(k!==+b.dataset.k);});});
 if(gated){$$('.sim',h).forEach(s=>s.setAttribute('inert',''));let n=0;
  E.pred.forEach(p=>$('#preds',h).append(Q.prediction(p,()=>{n++;if(n===E.pred.length){$$('.sim',h).forEach(s=>s.removeAttribute('inert'));$('#lock',h).textContent='🔓 Simulation unlocked. Test your predictions and complete the tasks.';}})));}
 upd();};

/* ---- Explain ---- */
R.explain=(h,m,C)=>{const X=C.explain,key='expl_'+m.id;
 h.innerHTML=`<div class="card"><span class="simtag">Explain</span><h2>Explain it in your own words</h2><p>${T(X.prompt)}</p><label class="sr" for="ea">Your explanation</label><textarea id="ea" placeholder="Write your explanation here…" style="min-height:130px"></textarea><div class="chips">${X.starters.map(s=>`<button type="button" class="chip st">${esc(s)}</button>`).join('')}</div><details><summary>Need a hint?</summary><p>${T(X.hint)}</p></details><div class="actions"><button type="button" class="btn primary" id="cm">Compare with the model answer</button></div><div id="mo"></div></div>`;
 const ta=$('#ea',h);ta.value=S.draft[key]||'';ta.oninput=()=>{S.draft[key]=ta.value;save();};
 $$('.st',h).forEach(b=>b.onclick=()=>{ta.value+=(ta.value&&!/\s$/.test(ta.value)?' ':'')+b.textContent+' ';ta.focus();ta.oninput();});
 $('#cm',h).onclick=()=>{if(ta.value.trim().length<10){$('#mo',h).innerHTML='<div class="fb bad"><b class="t">Write something first.</b>Even a short attempt helps you learn. Use the sentence starters if you are stuck.</div>';return;}
  ta.readOnly=true;$('#cm',h).disabled=true;
  $('#mo',h).innerHTML=`<div class="reveal"><b>Model answer</b><p>${T(X.model)}</p><b>Tick each thing your answer did (be honest – the computer cannot mark written work)</b>${X.ideas.map(t=>`<label class="opt"><input type="checkbox"><span>${T(t)}</span></label>`).join('')}<div class="actions"><button type="button" class="btn teal" id="sv">Save my self-assessment</button></div></div>`;
  $('#sv',h).onclick=()=>{const k=$$('#mo input:checked',h).length;S.expl[m.id]={got:k,of:X.ideas.length};save();P.setStage(m.id,'explain');$('#sv',h).disabled=true;$$('#mo input',h).forEach(i=>i.disabled=true);
   $('#mo',h).insertAdjacentHTML('beforeend',`<div class="fb ${k===X.ideas.length?'good':'bad'}" style="margin-top:10px"><b class="t">You ticked ${k} of ${X.ideas.length} points.</b>${k===X.ideas.length?'Excellent – a full answer.':k>=Math.ceil(X.ideas.length/2)?'Good start. Improve it by adding the missing points from the model answer, then rewrite your answer.':'Compare carefully with the model answer, note the missing ideas and have another go.'}</div><div class="actions" style="margin-top:10px">${contBtn('#/m/'+m.id+'/practise','Continue to Practise')}</div>`);};};
 if(P.stage(m.id,'explain'))$('#mo',h).innerHTML=`<p class="sim-note">You have already completed this stage. You can still write another answer and compare it again.</p><div class="actions">${contBtn('#/m/'+m.id+'/practise','Continue to Practise')}</div>`;};

/* ---- Practise ---- */
R.practise=(h,m,C)=>{const ids=[...(C.retr||[]).map(id=>[id,'Retrieval: earlier topic']),...C.practise.map(id=>[id,null])].filter(x=>QB[x[0]]);let n=0,got=0,of=0;
 h.innerHTML=`<div class="card"><span class="simtag">Practise</span><h2>Practise</h2><p>Questions get harder as you go. If you are wrong the first time you get a hint and a second try. Written answers are marked by you.</p><div class="bar" aria-hidden="true"><i id="pb" style="width:0%"></i></div><p id="pc" aria-live="polite">0 of ${ids.length} answered</p></div><div id="ql"></div><div id="pe"></div>`;
 ids.forEach(([id,tag],k)=>$('#ql',h).append(Q.render(QB[id],{num:k+1,tag,onDone:r=>{n++;got+=r.frac*r.q.marks;of+=r.q.marks;$('#pb',h).style.width=pct(n,ids.length)+'%';$('#pc',h).textContent=`${n} of ${ids.length} answered`;
  if(n===ids.length){P.setStage(m.id,'practise');$('#pe',h).innerHTML=`<div class="card"><h3>Practice complete</h3><p>This session: <b>${fmt(got,1)} out of ${of}</b> marks (${pct(got,of)}%).</p><div class="actions">${contBtn('#/m/'+m.id+'/reflect','Continue to Reflect')}</div></div>`;$('#pe',h).scrollIntoView({behavior:Motion.on?'smooth':'auto',block:'nearest'});}}})));
 if(P.stage(m.id,'practise'))$('#pe',h).innerHTML=`<div class="card flat"><p>You have completed this stage before. Work through again to improve your marks.</p><div class="actions">${contBtn('#/m/'+m.id+'/reflect','Continue to Reflect')}</div></div>`;};

/* ---- Reflect ---- */
R.reflect=(h,m,C)=>{const ids=C.reflect.filter(id=>QB[id]);let n=0;const res=[];
 h.innerHTML=`<div class="card"><span class="simtag">Reflect</span><h2>Knowledge check</h2><p>Three questions to check what you have learned in this module.</p></div><div id="kc"></div><div id="after"></div>`;
 const after=()=>{const wr=res.filter(r=>r.frac<1);
  const nxM=MODS[MODS.findIndex(x=>x.id===m.id)+1];
  $('#after',h).innerHTML=`<div class="card"><h2>Misconception check</h2>${wr.length?`<p>Questions to think about again:</p><ul>${wr.map(r=>`<li><b>${esc(short(r.q.q,100))}</b><br>${T(r.q.why||'')}</li>`).join('')}</ul>`:'<p>✅ You got all of these right. Here are common mistakes to watch out for:</p>'}<div class="tbl"><table><thead><tr><th>Common idea</th><th>The science</th></tr></thead><tbody>${C.misc.map(x=>`<tr><td>${T(x[0])}</td><td>${T(x[1])}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><h2>Summary</h2><ul>${C.summary.map(s=>`<li>${T(s)}</li>`).join('')}</ul></div>
  <div class="card"><h2>How confident do you feel?</h2><div class="actions" role="group" aria-label="Confidence rating"><button type="button" class="btn conf" data-v="1">😟 Not confident yet</button><button type="button" class="btn conf" data-v="2">🙂 Fairly confident</button><button type="button" class="btn conf" data-v="3">😀 Very confident</button></div><p id="cadv" aria-live="polite"></p></div>
  <div class="card"><h2>What to learn next</h2><p>${T(C.next)}</p><div class="actions" id="nxt"></div></div>`;
  const nextLinks=()=>{$('#nxt',h).innerHTML=(nxM?`<a class="btn primary" href="#/m/${nxM.id}/discover">Module ${nxM.n}: ${nxM.title} →</a>`:`<a class="btn primary" href="#/myths">Mythbusters →</a><a class="btn" href="#/exam">Exam Practice</a>`)+'<a class="btn" href="#/progress">My progress</a>';};
  const advice={1:`That is fine. Go back to <a href="#/m/${m.id}/learn">Learn</a> and <a href="#/m/${m.id}/practise">Practise</a> again. Confidence grows with practice.`,2:'Good. Try the questions you found hardest once more.',3:'Excellent. Challenge yourself with the Exam Practice area.'};
  const finish=()=>{if(S.conf[m.id]&&n===ids.length){P.setStage(m.id,'reflect');if(P.modDone(m.id))$('#cadv',h).insertAdjacentHTML('beforeend',' <b>🎉 Module complete!</b>');}};
  $$('.conf',h).forEach(b=>{if(+b.dataset.v===S.conf[m.id])b.setAttribute('aria-pressed','true');b.onclick=()=>{S.conf[m.id]=+b.dataset.v;save();$$('.conf',h).forEach(x=>x.setAttribute('aria-pressed',x===b));$('#cadv',h).innerHTML=advice[b.dataset.v];finish();renderNav();};});
  if(S.conf[m.id])$('#cadv',h).innerHTML=advice[S.conf[m.id]];
  nextLinks();finish();};
 ids.forEach((id,k)=>$('#kc',h).append(Q.render(QB[id],{num:k+1,onDone:r=>{n++;res.push(r);if(n===ids.length)after();}})));};

/* ---- module page ---- */
function viewModule(h,id,stage){
 const m=MODS.find(x=>x.id===id),C=MC[id];if(!m||!C)return notFound(h);
 if(!STAGES.includes(stage))stage=STAGES.find(s=>!P.stage(id,s))||'discover';
 h.innerHTML=`<h1>${m.icon} Module ${m.n}: ${m.title}</h1><nav aria-label="Module stages"><div class="chips">${STAGES.map(s=>`<a class="chip${P.stage(id,s)?' done':''}" href="#/m/${id}/${s}"${s===stage?' aria-current="step"':''}>${STAGE_NAMES[s]}</a>`).join('')}</div></nav><div id="stage"></div>`;
 document.title=`${STAGE_NAMES[stage]} – ${m.title} – Year 7 Gravity`;
 R[stage]($('#stage',h),m,C);}

function notFound(h){h.innerHTML='<h1>Page not found</h1><p><a class="btn" href="#/">Go to the home page</a></p>';}

/* ---- navigation ---- */
function curRoute(){return (location.hash||'#/').replace(/^#\/?/,'').split('/');}
function renderNav(){
 const r=curRoute(),a=(href,cur,label,tick='')=>`<li><a href="${href}"${cur?' aria-current="page"':''}>${label}${tick?`<span class="tick">${tick}</span>`:''}</a></li>`;
 const top=r[0]||'';
 $('#side').innerHTML=`<div class="brand"><span aria-hidden="true" style="font-size:1.6rem">🪐</span><b>Gravity Explorer</b></div><ul class="navlist">${a('#/',top==='','🏠 Home')}${a('#/progress',top==='progress','📊 My Progress')}</ul><div class="navsep">Modules</div><ul class="navlist">${MODS.map(m=>a(`#/m/${m.id}/${STAGES.find(s=>!P.stage(m.id,s))||'discover'}`,top==='m'&&r[1]===m.id,`${m.icon} ${m.n}. ${m.title.split(':')[0].replace('Gravity and the ','').replace('Falling Objects and Terminal Velocity','Falling Objects')}`,P.modDone(m.id)?'✓':P.stagesDone(m.id)?P.stagesDone(m.id)+'/6':'')).join('')}</ul><div class="navsep">Revise</div><ul class="navlist">${a('#/myths',top==='myths','🧪 Mythbusters',P.mythDone()?P.mythDone()+'/'+MYTHS.length:'')}${a('#/exam',top==='exam','📝 Exam Practice',P.examDone()?P.examDone()+'/4':'')}${a('#/weak',top==='weak','🎯 Weakest Topics')}${a('#/glossary',top==='glossary','📖 Glossary')}</ul><div class="navfoot"><button type="button" class="btn small ghost" id="setbtn">⚙️ Settings</button></div>`;
 $('#setbtn').onclick=openSettings;
 const ov=P.overall(),ring=$('.ring');if(ring){ring.style.setProperty('--p',ov);$('span',ring).textContent=ov+'%';ring.setAttribute('aria-label','Overall progress '+ov+' percent');}
 $$('#side a').forEach(x=>x.addEventListener('click',()=>$('#side').classList.remove('open')));}

/* ---- settings ---- */
function applySettings(){document.documentElement.classList.toggle('big',!!S.set.big);document.documentElement.classList.toggle('calm',!!S.set.reduce);}
function openSettings(){const d=$('#setdlg');
 d.innerHTML=`<h2>Settings</h2><label class="opt"><input type="checkbox" id="sbig"${S.set.big?' checked':''}><span>Larger text</span></label><label class="opt"><input type="checkbox" id="sred"${S.set.reduce?' checked':''}><span>Reduce motion (stops animations)</span></label><p class="sim-note">Your progress is stored only in this browser. No personal information is collected.</p><div class="actions"><button type="button" class="btn warn" id="sres">Reset all progress</button><button type="button" class="btn primary" id="scl">Close</button></div>`;
 $('#sbig',d).onchange=e=>{S.set.big=e.target.checked;save();applySettings();};$('#sred',d).onchange=e=>{S.set.reduce=e.target.checked;save();applySettings();route();};
 $('#scl',d).onclick=()=>d.close();$('#sres',d).onclick=()=>{d.close();openReset();};
 d.showModal();}
function openReset(){const d=$('#rstdlg');d.innerHTML=`<h2>Reset all progress?</h2><p>This permanently deletes your progress, answers and settings from this browser. It cannot be undone.</p><div class="actions"><button type="button" class="btn" id="rno">No, keep my progress</button><button type="button" class="btn warn" id="ryes">Yes, delete everything</button></div>`;
 $('#rno',d).onclick=()=>d.close();$('#ryes',d).onclick=()=>{S=blank();try{localStorage.removeItem(KEY);}catch(e){}applySettings();d.close();location.hash='#/';route();};d.showModal();}

/* ---- router ---- */
function route(){
 stopLoops();hidePop();
 const r=curRoute(),h=$('#view');let title='Year 7 Gravity – Interactive Learning';
 h.innerHTML='';
 try{
  switch(r[0]){
   case '':case undefined:pageHome(h);break;
   case 'progress':pageProgress(h);title='My Progress – '+title;break;
   case 'm':viewModule(h,r[1],r[2]);title=null;break;
   case 'myths':pageMyths(h);title='Mythbusters – '+title;break;
   case 'exam':r[1]?pageExamRun(h,r[1]):pageExam(h);title='Exam Practice – '+title;break;
   case 'weak':pageWeak(h);title='Weakest Topics – '+title;break;
   case 'retry':pageRetry(h);title='Retry – '+title;break;
   case 'glossary':pageGlossary(h);title='Glossary – '+title;break;
   default:notFound(h);}
 }catch(e){console.error(e);h.innerHTML='<h1>Something went wrong</h1><p>Please go back to the home page.</p><a class="btn" href="#/">Home</a>';}
 if(title)document.title=title;
 renderNav();
 window.scrollTo(0,0);
 const hd=$('h1',h);if(hd){hd.setAttribute('tabindex','-1');hd.focus({preventScroll:true});}}

function init(){
 S.visits=(S.visits||0)+1;save();applySettings();
 $('#menu').onclick=()=>{const s=$('#side');const o=s.classList.toggle('open');$('#menu').setAttribute('aria-expanded',o);};
 $('#mainlink').onclick=e=>{e.preventDefault();const v=$('#view');v.setAttribute('tabindex','-1');v.focus();};
 window.addEventListener('hashchange',route);
 if(!canSave)$('#nosave').hidden=false;
 route();}
document.addEventListener('DOMContentLoaded',init);


</script>
</body>
</html>
